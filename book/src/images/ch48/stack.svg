<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 320' width='900' height='320' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='900' height='320' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>브라우저 안의 badak: 워커 안의 모듈, 그리고 같은 메모리를 보는 워커들</text><rect x='20.0' y='50.0' width='210.0' height='250.0' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='125' y='74' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='bold'>페이지 (주 스레드)</text><text x='125' y='104' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>화면을 그린다</text><text x='125' y='126' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>입력을 받는다</text><text x='125' y='148' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>client.js</text><text x='125' y='170' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>기다릴 수 없다</text><rect x='300.0' y='50.0' width='300.0' height='250.0' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='450' y='74' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='bold'>엔진 워커 (engine.js)</text><rect x='320.0' y='90.0' width='260.0' height='44.0' rx='6' fill='#ffffff' stroke='#2563eb' stroke-width='1'/><text x='450' y='109' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>badak.js: 모듈을 올리고 감싼다</text><text x='450' y='126' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>파일을 받아 캐시에 넣는다</text><rect x='320.0' y='144.0' width='260.0' height='40.0' rx='6' fill='#ffffff' stroke='#2563eb' stroke-width='1'/><text x='450' y='162' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>wasi.js: 엔진이 들여오는 함수 23개</text><text x='450' y='177' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>파일, 시계, 난수, 환경 변수</text><rect x='320.0' y='198.0' width='260.0' height='86.0' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='450' y='220' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='bold'>badak_*.wasm</text><text x='450' y='240' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>엔진 전체 (Rust, 0.9MB)</text><text x='450' y='258' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>내놓는 함수: badak_web_*</text><text x='450' y='274' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>들여오는 함수: WASI, piece</text><rect x='680.0' y='60.0' width='200.0' height='50.0' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='780' y='81' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='bold'>스레드 워커 1 (thread.js)</text><text x='780' y='99' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>같은 모듈을 한 번 더 올린다</text><rect x='680.0' y='122.0' width='200.0' height='50.0' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='780' y='143' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='bold'>스레드 워커 2 (thread.js)</text><text x='780' y='161' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>같은 모듈을 한 번 더 올린다</text><rect x='680.0' y='184.0' width='200.0' height='50.0' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='780' y='205' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='bold'>스레드 워커 3 (thread.js)</text><text x='780' y='223' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>같은 모듈을 한 번 더 올린다</text><rect x='680.0' y='250.0' width='200.0' height='50.0' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5' stroke-dasharray='5 3'/><text x='780' y='271' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='bold'>공유 메모리</text><text x='780' y='289' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>격리된 페이지에서만</text><line x1='232' y1='150' x2='296' y2='150' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='296' y1='190' x2='232' y2='190' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><text x='264' y='142' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>요청</text><text x='264' y='206' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>답, 글 조각</text><line x1='602' y1='110' x2='676' y2='85' stroke='#059669' stroke-width='1.5' marker-end='url(#arrow-059669)'/><line x1='602' y1='130' x2='676' y2='147' stroke='#059669' stroke-width='1.5' marker-end='url(#arrow-059669)'/><line x1='602' y1='150' x2='676' y2='209' stroke='#059669' stroke-width='1.5' marker-end='url(#arrow-059669)'/><text x='640' y='76' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>시작하라</text><line x1='582' y1='262' x2='676' y2='272' stroke='#d97706' stroke-width='1.5' marker-end='url(#arrow-d97706)' stroke-dasharray='5 3'/><line x1='780' y1='234' x2='780' y2='248' stroke='#d97706' stroke-width='1.5' marker-end='url(#arrow-d97706)' stroke-dasharray='5 3'/></svg>
