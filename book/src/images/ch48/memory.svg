<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 176' width='900' height='176' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='900' height='176' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>269MB짜리 파일이 지나가는 자리: 같은 바이트가 여러 번 있다</text><rect x='20' y='56' width='190' height='62' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='115.0' y='83.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>Hugging Face</text><text x='115.0' y='103.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>파일 269MB</text><rect x='242' y='56' width='190' height='62' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='337.0' y='83.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>브라우저의 캐시 저장소</text><text x='337.0' y='103.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>디스크에 269MB</text><line x1='212' y1='87' x2='238' y2='87' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='464' y='56' width='190' height='62' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='559.0' y='83.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>JavaScript의 배열</text><text x='559.0' y='103.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>메모리에 269MB</text><line x1='434' y1='87' x2='460' y2='87' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='686' y='56' width='190' height='62' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='781.0' y='83.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>모듈의 메모리</text><text x='781.0' y='103.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>281MB (가중치 + 엔진)</text><line x1='656' y1='87' x2='682' y2='87' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><text x='115' y='140' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>판을 고정한 주소</text><text x='115' y='158' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>CORS를 허락한다</text><text x='337' y='140' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>다음에는 여기에서 꺼낸다</text><text x='337' y='158' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>브라우저가 지울 수 있다</text><text x='559' y='140' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>엔진이 읽고 나면 내려놓는다</text><text x='559' y='158' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>그 전까지 두 벌이다</text><text x='781' y='140' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>자라기만 하고 줄지 않는다</text><text x='781' y='158' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>한도는 4GB (스레드 빌드 1GB)</text></svg>
