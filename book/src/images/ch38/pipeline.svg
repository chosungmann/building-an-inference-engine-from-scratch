<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1140 204' width='1140' height='204' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='1140' height='204' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>말을 듣고 말로 답하기: 모델 셋</text><rect x='20' y='56' width='138' height='50' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='89.0' y='77.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>사용자의 말</text><text x='89.0' y='97.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>소리, 16kHz</text><rect x='178' y='56' width='138' height='50' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='247.0' y='77.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>받아쓰기</text><text x='247.0' y='97.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>Whisper (33장)</text><line x1='160' y1='81' x2='175' y2='81' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='336' y='56' width='138' height='50' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='405.0' y='77.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>글</text><text x='405.0' y='97.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>And so my fellow…</text><line x1='318' y1='81' x2='333' y2='81' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='494' y='56' width='138' height='50' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='563.0' y='77.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>답 쓰기</text><text x='563.0' y='97.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>언어 모델 (2부)</text><line x1='476' y1='81' x2='491' y2='81' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='652' y='56' width='138' height='50' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='721.0' y='77.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>문장</text><text x='721.0' y='97.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>끝나는 대로 하나씩</text><line x1='634' y1='81' x2='649' y2='81' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='810' y='56' width='138' height='50' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='879.0' y='77.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>소리로</text><text x='879.0' y='97.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>음성 합성 (37장)</text><line x1='792' y1='81' x2='807' y2='81' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='968' y='56' width='138' height='50' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='1037.0' y='77.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>답의 소리</text><text x='1037.0' y='97.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>24kHz, 낱말마다</text><line x1='950' y1='81' x2='965' y2='81' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><path d='M879.0,108 L879.0,140 L563.0,140 L563.0,110' fill='none' stroke='#6b7280' stroke-width='1.5' stroke-dasharray='5,4' marker-end='url(#arrow-6b7280)'/><text x='721.0' y='156' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>문장 하나를 다 말하면 다음 문장을 쓰러 돌아간다</text><text x='20' y='186' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>모델 사이를 오가는 것은 글이다. 앞 모델이 다 끝나기를 기다리지 않고, 쓸 수 있는 만큼이 나오면 다음 모델로 넘긴다.</text></svg>
