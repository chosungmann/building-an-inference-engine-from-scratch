<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 248' width='900' height='248' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='900' height='248' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>ResNet-50의 블록: 줄이고, 보고, 늘리고, 더한다</text><rect x='150' y='86' width='130' height='54' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='215.0' y='109.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>CONV 1 × 1</text><text x='215.0' y='129.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>256 → 64</text><rect x='330' y='86' width='130' height='54' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.5'/><text x='395.0' y='109.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>CONV 3 × 3</text><text x='395.0' y='129.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>64 → 64</text><rect x='510' y='86' width='130' height='54' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='575.0' y='109.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>CONV 1 × 1</text><text x='575.0' y='129.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>64 → 256</text><rect x='690' y='86' width='130' height='54' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='755.0' y='109.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>ADD</text><text x='755.0' y='129.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>+ ReLU</text><line x1='60' y1='113.0' x2='148' y2='113.0' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='280' y1='113.0' x2='328' y2='113.0' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='460' y1='113.0' x2='508' y2='113.0' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='640' y1='113.0' x2='688' y2='113.0' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='820' y1='113.0' x2='880' y2='113.0' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><path d='M100,113.0 L100,58 L755,58 L755,84' fill='none' stroke='#d97706' stroke-width='1.5' marker-end='url(#arrow-d97706)'/><text x='430' y='50' fill='#d97706' font-size='11' text-anchor='middle' font-weight='normal'>건너뛰는 길 (56 × 56 × 256을 그대로)</text><text x='60' y='135.0' fill='#6b7280' font-size='10' text-anchor='start' font-weight='normal'>56×56×256</text><text x='305' y='156' fill='#6b7280' font-size='10' text-anchor='middle' font-weight='normal'>56×56×64</text><text x='485' y='156' fill='#6b7280' font-size='10' text-anchor='middle' font-weight='normal'>56×56×64</text><text x='665' y='156' fill='#6b7280' font-size='10' text-anchor='middle' font-weight='normal'>56×56×256</text><text x='20' y='188' fill='#1f2933' font-size='12' text-anchor='start' font-weight='bold'>곱셈의 수 (자리 3,136개)</text><text x='215' y='188' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>5천만</text><text x='395' y='188' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>1억 1,600만</text><text x='575' y='188' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>5천만</text><text x='20' y='214' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>3 × 3을 256채널에서 그대로 하면 18억 5천만 번이다. 앞뒤의 1 × 1이 채널을 4분의 1로 줄였다가 되돌려서</text><text x='20' y='232' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>블록 전체가 2억 1,800만 번이 된다. 이런 블록이 열여섯 개이고, 노드 53개가 합성곱이다.</text></svg>
