weight='normal'>⋮</text><text x='770' y='52' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='bold'>출력</text><text x='770' y='202' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>(자리 수) × (출력 채널)</text><text x='20' y='236' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>가운데의 곱셈은 5장의 선형 층이다. 16~18장에서 다듬은 커널을 그대로 쓴다. 대가는 펼친 행렬이다.</text><text x='20' y='254' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>입력의 값 하나가 창 아홉 개에 들어가므로 3 × 3 창이면 입력의 아홉 배쯤 되는 메모리를 쓴다.</text><text x='20' y='272' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>창이 1 × 1이고 보폭이 1이면 창 하나가 픽셀 하나다. 입력이 이미 펼친 행렬이어서 펼칠 것이 없다.</text></svg>
