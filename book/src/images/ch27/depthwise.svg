'normal'>C = 256이면 8.7분의 1</text><text x='20' y='364' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>깊이별 합성곱은 채널 사이를 잇지 않는다. 공간을 보는 일(3 × 3)과 채널을 섞는 일(1 × 1)을 나눈 것이다.</text></svg>
