<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 284' width='920' height='284' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='920' height='284' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>글을 읽는 서버와 답을 쓰는 서버를 따로 둔다</text><rect x='20' y='110' width='130' height='50' rx='8' fill='#ffffff' stroke='#6b7280' stroke-width='1.5'/><text x='85.0' y='131.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>요청</text><text x='85.0' y='151.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>긴 글 + 질문</text><rect x='220' y='60' width='200' height='60' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='320.0' y='86.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>읽는 서버</text><text x='320.0' y='106.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>프롬프트를 한 번에 읽는다</text><rect x='220' y='170' width='200' height='60' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='320.0' y='196.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>쓰는 서버</text><text x='320.0' y='216.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>토큰을 하나씩 쓴다</text><line x1='152' y1='128' x2='216' y2='96' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><text x='176' y='96' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='bold'>1</text><path d='M320,122 L320,166' fill='none' stroke='#7c3aed' stroke-width='2.5' marker-end='url(#arrow-1f2933)'/><rect x='336.0' y='130.0' width='150.0' height='28.0' rx='4' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.5'/><text x='411' y='149' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>2  KV 캐시를 넘긴다</text><line x1='422' y1='200' x2='520' y2='200' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><text x='470' y='192' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='bold'>3</text><rect x='524' y='174' width='150' height='52' rx='8' fill='#ffffff' stroke='#6b7280' stroke-width='1.5'/><text x='599.0' y='196.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>답</text><text x='599.0' y='216.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>흘러나온다</text><text x='700' y='84' fill='#d97706' font-size='12' text-anchor='start' font-weight='normal'>계산을 꽉 채워 쓴다.</text><text x='700' y='102' fill='#d97706' font-size='12' text-anchor='start' font-weight='normal'>걸음이 길어도 된다.</text><text x='700' y='196' fill='#059669' font-size='12' text-anchor='start' font-weight='normal'>다른 요청들의 답도 함께 쓴다.</text><text x='700' y='214' fill='#059669' font-size='12' text-anchor='start' font-weight='normal'>걸음이 고르고 짧아야 한다.</text><text x='20' y='268' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>넘어가는 것은 글이 아니라 KV 캐시다. 토큰 하나에 수십 킬로바이트여서, 넘기는 길이 빨라야 한다.</text></svg>
