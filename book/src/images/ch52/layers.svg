<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 946 304' width='946' height='304' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='946' height='304' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>그래프가 프로그램이 되기까지: 7장의 신경망</text><rect x='20.0' y='44.0' width='250.0' height='40.0' rx='6' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='145.0' y='61' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='bold'>1. 그래프</text><text x='145.0' y='77' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>무엇을 계산하는가</text><rect x='304.0' y='44.0' width='282.0' height='40.0' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='445.0' y='61' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='bold'>2. 반복문</text><text x='445.0' y='77' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>어떤 순서로 도는가</text><rect x='626.0' y='44.0' width='300.0' height='40.0' rx='6' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='776.0' y='61' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='bold'>3. 소스</text><text x='776.0' y='77' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>기계가 읽을 글</text><rect x='60.0' y='104.0' width='170.0' height='38.0' rx='6' fill='#ffffff' stroke='#2563eb' stroke-width='1.5'/><text x='145' y='121' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='bold'>FULLY_CONNECTED</text><text x='145' y='136' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>784 → 128</text><rect x='60.0' y='162.0' width='170.0' height='38.0' rx='6' fill='#ffffff' stroke='#2563eb' stroke-width='1.5'/><text x='145' y='179' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='bold'>RELU</text><text x='145' y='194' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>128</text><line x1='145' y1='142' x2='145' y2='160' stroke='#2563eb' stroke-width='1.5' marker-end='url(#arrow-2563eb)'/><rect x='60.0' y='220.0' width='170.0' height='38.0' rx='6' fill='#ffffff' stroke='#2563eb' stroke-width='1.5'/><text x='145' y='237' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='bold'>FULLY_CONNECTED</text><text x='145' y='252' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>128 → 10</text><line x1='145' y1='200' x2='145' y2='218' stroke='#2563eb' stroke-width='1.5' marker-end='url(#arrow-2563eb)'/><rect x='310.0' y='104.0' width='270.0' height='96.0' rx='6' fill='#ffffff' stroke='#d97706' stroke-width='1.5'/><text x='320' y='121' fill='#1f2933' font-size='11' xml:space='preserve' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>for r in 0..128</text><text x='332' y='136' fill='#1f2933' font-size='10' xml:space='preserve' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>out[r] = max(dot(x, W1[r]) + b1[r], 0)</text><rect x='310.0' y='220.0' width='270.0' height='38.0' rx='6' fill='#ffffff' stroke='#d97706' stroke-width='1.5'/><text x='320' y='237' fill='#1f2933' font-size='11' xml:space='preserve' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>for r in 0..10</text><text x='332' y='252' fill='#1f2933' font-size='10' xml:space='preserve' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>out[r] = dot(h, W2[r]) + b2[r]</text><text x='445' y='162' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>선형 층과 ReLU가</text><text x='445' y='178' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>반복문 하나로 합쳐졌다</text><rect x='626.0' y='104.0' width='300.0' height='154.0' rx='6' fill='#ffffff' stroke='#059669' stroke-width='1.5'/><text x='634' y='122' fill='#1f2933' font-size='9.5' xml:space='preserve' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>fn dot_784_16_1(x: &amp;[f32; 784], ...)</text><text x='634' y='139' fill='#1f2933' font-size='9.5' xml:space='preserve' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>    while i &lt; 784 {</text><text x='634' y='156' fill='#1f2933' font-size='9.5' xml:space='preserve' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>        sums[r][k] += x[i + k] * w[r][i + k];</text><text x='634' y='173' fill='#1f2933' font-size='9.5' xml:space='preserve' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>pub fn run(state, input, output) {</text><text x='634' y='190' fill='#1f2933' font-size='9.5' xml:space='preserve' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>    while r &lt; 128 {</text><text x='634' y='207' fill='#1f2933' font-size='9.5' xml:space='preserve' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>        state.v6[r] = (dots[0] + C2[r]).max(0.0);</text><text x='634' y='224' fill='#1f2933' font-size='9.5' xml:space='preserve' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>    while r &lt; 10 {</text><text x='634' y='241' fill='#1f2933' font-size='9.5' xml:space='preserve' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>        output[r] = dots[0] + C4[r];</text><line x1='258' y1='180' x2='294' y2='180' stroke='#6b7280' stroke-width='2' marker-end='url(#arrow-6b7280)'/><text x='276' y='200' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>낮추기</text><line x1='586' y1='180' x2='622' y2='180' stroke='#6b7280' stroke-width='2' marker-end='url(#arrow-6b7280)'/><text x='604' y='200' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>적기</text><text x='20' y='290' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>아래로 갈수록 형상이 숫자로 박히고, 기계에 가까워지고, 다른 모델에는 쓸 수 없게 된다.</text></svg>
