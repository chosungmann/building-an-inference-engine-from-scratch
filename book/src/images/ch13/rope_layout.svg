<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 320' width='720' height='320' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='720' height='320' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>회전의 짝짓기와 가중치의 행 순서 (헤드 하나, 길이를 8로 줄인 그림)</text><text x='40' y='70' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>원본 (safetensors)</text><text x='40' y='87' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>앞 절반 a와 뒤 절반 b. 같은 번호끼리 짝: (a0, b0), (a1, b1), …</text><rect x='40' y='96' width='44' height='44' rx='5' fill='#dbeafe' stroke='#2563eb'/><text x='62.0' y='123.0' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>a0</text><rect x='90' y='96' width='44' height='44' rx='5' fill='#fef3c7' stroke='#d97706'/><text x='112.0' y='123.0' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>a1</text><rect x='140' y='96' width='44' height='44' rx='5' fill='#d1fae5' stroke='#059669'/><text x='162.0' y='123.0' fill='#1f2933' font-size='13' text-anchor='middle' font-wei