<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 250' width='1100' height='250' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='1100' height='250' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>Llama 3.2 1B를 올렸을 때의 메모리: 운영체제가 앱의 것으로 세는 쪽과 세지 않는 쪽</text><rect x='20.0' y='44.0' width='14.0' height='10.0' rx='0' fill='#d97706'/><text x='40' y='54' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>더러운 쪽 (프로그램이 써 넣었다. 발자국에 든다)</text><rect x='380.0' y='44.0' width='14.0' height='10.0' rx='0' fill='#dbeafe' stroke='#2563eb' stroke-width='1'/><text x='400' y='54' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>깨끗한 쪽 (파일을 비췄다. 모자라면 버릴 수 있다)</text><text x='190' y='91' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>파일 그대로 비추기</text><rect x='200.0' y='74.0' width='5.2' height='24.0' rx='0' fill='#d97706'/><rect x='205.2' y='74.0' width='307.3' height='24.0' rx='0' fill='#dbeafe' stroke='#2563eb' stroke-width='1'/><text x='520.5005254723787' y='91' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>더러운 쪽 40MB, 깨끗한 쪽 2,358MB</text><text x='190' y='127' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>f32로 펼치기</text><rect x='200.0' y='110.0' width='619.9' height='24.0' rx='0' fill='#d97706'/><rect x='819.9' y='110.0' width='0.1' height='24.0' rx='0' fill='#dbeafe' stroke='#2563eb' stroke-width='1'/><text x='828.0' y='127' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>더러운 쪽 4,757MB, 깨끗한 쪽 1MB</text><text x='190' y='163' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>8비트 파일 비추기</text><rect x='200.0' y='146.0' width='5.2' height='24.0' rx='0' fill='#d97706'/><rect x='205.2' y='146.0' width='163.3' height='24.0' rx='0' fill='#dbeafe' stroke='#2563eb' stroke-width='1'/><text x='376.50007482726676' y='163' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>더러운 쪽 40MB, 깨끗한 쪽 1,253MB</text><text x='190' y='199' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>4비트 파일 비추기</text><rect x='200.0' y='182.0' width='5.1' height='24.0' rx='0' fill='#d97706'/><rect x='205.1' y='182.0' width='86.5' height='24.0' rx='0' fill='#dbeafe' stroke='#2563eb' stroke-width='1'/><text x='299.61295638327033' y='199' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>더러운 쪽 39MB, 깨끗한 쪽 664MB</text><text x='20' y='234' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>같은 모델이다. 가중치를 프로그램이 만들면 더러운 쪽이 되고, 파일에 있는 그대로 쓰면 깨끗한 쪽이 된다.</text></svg>
