8' x2='360' y2='298' stroke='#7c3aed' stroke-width='0.6'/><line x1='334' y1='220' x2='334' y2='324' stroke='#7c3aed' stroke-width='0.6'/><text x='308.0' y='340' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>바꾼 필터 4 × 4</text><text x='308' y='218' fill='#1f2933' font-size='18' text-anchor='middle' font-weight='normal'>⊙</text><text x='368' y='218' fill='#1f2933' font-size='11' text-anchor='start' font-weight='normal'>칸끼리 곱한다: 16번</text><path d='M368,232 L480,232' fill='none' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='486.0' y='180.0' width='104.0' height='104.0' rx='0' fill='#fef3c7' stroke='#d97706' stroke-width='1.2'/><line x1='486' y1='206' x2='590' y2='206' stroke='#d97706' stroke-width='0.6'/><line x1='512' y1='180' x2='512' y2='284' stroke='#d97706' stroke-width='0.6'/><line x1='486' y1='232' x2='590' y2='232' stroke='#d97706' stroke-width='0.6'/><line x1='538' y1='180' x2='538' y2='284' stroke='#d97706' stroke-width='0.6'/><line x1='486' y1='258' x2='590' y2='258' stroke='#d97706' stroke-width='0.6'/><line x1='564' y1='180' x2='564' y2='284' stroke='#d97706' stroke-width='0.6'/><text x='538.0' y='300' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>곱 4 × 4</text><path d='M596,232 L690,232' fill='none' stroke='#d97706' stroke-width='1.5' marker-end='url(#arrow-d97706)'/><text x='642' y='224' fill='#d97706' font-size='10' text-anchor='middle' font-weight='normal'>더하고 빼기 (Aᵀ M A)</text><rect x='696.0' y='206.0' width='52.0' height='52.0' rx='0' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><line x1='696' y1='232' x2='748' y2='232' stroke='#059669' stroke-width='0.6'/><line x1='722' y1='206' x2='722' y2='258' stroke='#059669' stroke-width='0.6'/><text x='722.0' y='274' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>출력 2 × 2</text><text x='20' y='364' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>정의대로 하면 출력 넷에 곱셈이 4 × 9 = 36번이다(채널 쌍마다). 16번으로 줄어 2.25분의 1이 된다.</text><text x='20' y='382' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>칸마다의 곱셈은 채널 전체로 보면 선형 층 하나다. 그래서 선형 층의 커널을 16번 부른다.</text><text x='20' y='400' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>대가는 앞뒤의 더하고 빼기다. 계산은 싸지만 값 전체를 메모리에서 두 번 더 훑는다.</text></svg>
