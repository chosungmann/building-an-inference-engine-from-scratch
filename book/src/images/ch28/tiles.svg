<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 930 316' width='930' height='316' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='930' height='316' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>일을 나누는 두 가지 방법</text><text x='30' y='60' fill='#1f2933' font-size='12' text-anchor='start' font-weight='bold'>27장: 통째로 펼치고, 가중치의 행을 나눈다</text><rect x='30.0' y='86.0' width='150.0' height='150.0' rx='2' fill='#f3f4f6' stroke='#6b7280' stroke-width='1'/><text x='105' y='156' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>펼친 행렬</text><text x='105' y='174' fill='#6b7280' font-size='10' text-anchor='middle' font-weight='normal'>(스레드 하나가 만든다)</text><text x='105' y='254' fill='#6b7280' font-size='10' text-anchor='middle' font-weight='normal'>7.4MB까지</text><text x='202' y='166' fill='#1f2933' font-size='16' text-anchor='middle' font-weight='normal'>×</text><rect x='226.0' y='116.0' width='120.0' height='22.0' rx='0' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='286' y='131' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>스레드 1</text><rect x='226.0' y='138.0' width='120.0' height='22.0' rx='0' fill='#fef3c7' stroke='#d97706' stroke-width='1.2'/><text x='286' y='153' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>스레드 2</text><rect x='226.0' y='160.0' width='120.0' height='22.0' rx='0' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><text x='286' y='175' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>스레드 3</text><rect x='226.0' y='182.0' width='120.0' height='22.0' rx='0' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.2'/><text x='286' y='197' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>스레드 4</text><text x='286' y='222' fill='#6b7280' font-size='10' text-anchor='middle' font-weight='normal'>가중치 (행이 출력 채널)</text><text x='30' y='282' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>스레드마다 펼친 행렬 전체를 읽는다.</text><text x='30' y='298' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>행렬이 캐시보다 크면 매번 메모리에서 다시 가져온다.</text><text x='480' y='60' fill='#1f2933' font-size='12' text-anchor='start' font-weight='bold'>28장: 출력을 조각내고, 조각마다 펼친다</text><rect x='480.0' y='86.0' width='110.0' height='30.0' rx='2' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='535' y='105' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>조각 (스레드 1)</text><text x='606' y='106' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>×</text><rect x='622.0' y='86.0' width='90.0' height='30.0' rx='0' fill='#f3f4f6' stroke='#6b7280' stroke-width='1'/><text x='667' y='105' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>가중치 전체</text><text x='728' y='106' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>=</text><rect x='744.0' y='86.0' width='70.0' height='30.0' rx='2' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='779' y='105' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>출력의 조각</text><rect x='480.0' y='124.0' width='110.0' height='30.0' rx='2' fill='#fef3c7' stroke='#d97706' stroke-width='1.2'/><text x='535' y='143' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>조각 (스레드 2)</text><text x='606' y='144' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>×</text><rect x='622.0' y='124.0' width='90.0' height='30.0' rx='0' fill='#f3f4f6' stroke='#6b7280' stroke-width='1'/><text x='667' y='143' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>가중치 전체</text><text x='728' y='144' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>=</text><rect x='744.0' y='124.0' width='70.0' height='30.0' rx='2' fill='#fef3c7' stroke='#d97706' stroke-width='1.2'/><text x='779' y='143' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>출력의 조각</text><rect x='480.0' y='162.0' width='110.0' height='30.0' rx='2' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><text x='535' y='181' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>조각 (스레드 3)</text><text x='606' y='182' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>×</text><rect x='622.0' y='162.0' width='90.0' height='30.0' rx='0' fill='#f3f4f6' stroke='#6b7280' stroke-width='1'/><text x='667' y='181' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>가중치 전체</text><text x='728' y='182' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>=</text><rect x='744.0' y='162.0' width='70.0' height='30.0' rx='2' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><text x='779' y='181' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>출력의 조각</text><rect x='480.0' y='200.0' width='110.0' height='30.0' rx='2' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.2'/><text x='535' y='219' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>조각 (스레드 4)</text><text x='606' y='220' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>×</text><rect x='622.0' y='200.0' width='90.0' height='30.0' rx='0' fill='#f3f4f6' stroke='#6b7280' stroke-width='1'/><text x='667' y='219' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>가중치 전체</text><text x='728' y='220' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>=</text><rect x='744.0' y='200.0' width='70.0' height='30.0' rx='2' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.2'/><text x='779' y='219' fill='#1f2933' font-size='10' text-anchor='middle' font-weight='normal'>출력의 조각</text><text x='535' y='254' fill='#6b7280' font-size='10' text-anchor='middle' font-weight='normal'>64KB까지</text><text x='480' y='282' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>스레드마다 자기 조각을 펼치고, 곱하고, 치우침과 활성화 함수까지 끝낸다.</text><text x='480' y='298' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>대신 스레드마다 가중치 전체를 읽는다. 가중치가 크고 조각이 잘면 손해다.</text></svg>
