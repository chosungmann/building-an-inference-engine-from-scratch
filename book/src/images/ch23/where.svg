='154' width='11.7' height='24' fill='#7c3aed'/><rect x='387.8' y='154' width='52.0' height='24' fill='#2563eb'/><text x='413.8207711010768' y='170' fill='#ffffff' font-size='11' text-anchor='middle' font-weight='normal'>29</text><rect x='439.8' y='154' width='23.8' height='24' fill='#6b7280'/><text x='471.6714136853074' y='171' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>118</text><text x='20' y='202' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>값을 옮기는 시간을 줄이고 나면, GPU에 맡기지 않은 어텐션이 다음으로 큰 덩어리다.</text></svg>
