<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 218' width='880' height='218' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='880' height='218' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>프롬프트 256토큰을 처리하는 시간이 쓰인 곳 (밀리초)</text><rect x='20' y='42' width='14' height='11' rx='2' fill='#d97706'/><text x='40' y='52' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>GPU의 계산</text><rect x='210' y='42' width='14' height='11' rx='2' fill='#7c3aed'/><text x='230' y='52' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>값을 올리고 내리기</text><rect x='400' y='42' width='14' height='11' rx='2' fill='#2563eb'/><text x='420' y='52' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>어텐션 (CPU)</text><rect x='590' y='42' width='14' height='11' rx='2' fill='#6b7280'/><text x='610' y='52' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>그 밖의 CPU 일</text><text x='238' y='91' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>표준 WebGPU만, 선형 층을 하나씩</text