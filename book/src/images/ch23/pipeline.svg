<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 308' width='880' height='308' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='880' height='308' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>GPU에 일을 시키는 순서</text><rect x='20' y='44' width='400' height='250' rx='8' fill='#ffffff' stroke='#6b7280' stroke-dasharray='6 4'/><text x='36' y='66' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>CPU (우리 프로그램)</text><rect x='480' y='44' width='380' height='250' rx='8' fill='#ffffff' stroke='#6b7280' stroke-dasharray='6 4'/><text x='496' y='66' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>GPU</text><rect x='40' y='78' width='360' height='44' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='220.0' y='96.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>1. 셰이더를 옮긴다</text><text x='220.0' y='116.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>WGSL 글 → GPU의 기계어</text><rect x='40' y='132' width='360' height='44' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='220.0' y='150.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>2. 버퍼에 값을 담는다</text><text x='220.0' y='170.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>입력, 가중치, 결과를 받을 자리</text><rect x='40' y='186' width='360' height='44' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='220.0' y='204.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>3. 명령을 적어 보낸다</text><text x='220.0' y='224.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>어느 커널을, 어느 버퍼로, 몇 그룹</text><rect x='40' y='240' width='360' height='44' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='220.0' y='258.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>4. 기다렸다가 읽는다</text><text x='220.0' y='278.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>결과 버퍼를 열어 값을 꺼낸다</text><rect x='500' y='78' width='340' height='44' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='670.0' y='96.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>커널</text><text x='670.0' y='116.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>스레드마다 실행되는 함수</text><rect x='500' y='132' width='340' height='44' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='670.0' y='150.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>버퍼</text><text x='670.0' y='170.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>GPU가 읽고 쓰는 메모리</text><rect x='500' y='186' width='340' height='44' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='670.0' y='204.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>실행</text><text x='670.0' y='224.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>그룹 × 그룹의 스레드 수만큼 동시에</text><rect x='500' y='240' width='340' height='44' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='670.0' y='258.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>결과</text><text x='670.0' y='278.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>버퍼에 적혀 있다</text><line x1='400' y1='100' x2='498' y2='100' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='400' y1='154' x2='498' y2='154' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='400' y1='208' x2='498' y2='208' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='500' y1='262' x2='402' y2='262' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/></svg>
