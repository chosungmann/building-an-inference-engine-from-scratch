<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 262' width='880' height='262' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='880' height='262' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>선형 층의 커널들 (벡터 256개 × 행 8,192개 × 길이 2,048)</text><text x='20' y='48' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>1초에 하는 곱셈의 수 (억 번). 값을 올리고 내리는 시간은 넣지 않았다.</text><text x='188' y='81' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>CPU (18장)</text><rect x='200' y='68' width='58.0' height='18' rx='3' fill='#6b7280'/><text x='265.98715776331045' y='82' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>5,654</text><text x='188' y='109' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>단순</text><rect x='200' y='96' width='33.1' height='18' rx='3' fill='#93c5fd'/><text x='241.10621599928655' y='110' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>3,228</text><text x='188' y='137' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>넷씩 네 줄기          8</text><rect x='200' y='124' width='53.5' height='18' rx='3' fill='#2563eb'/><text x='261.51556229376615' y='138' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>5,218</text><text x='188' y='165' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>CPU와 같은 순서       7</text><rect x='200' y='152' width='59.3' height='18' rx='3' fill='#2563eb'/><text x='267.2588959243735' y='166' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>5,778</text><text x='188' y='193' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>값 열여섯</text><rect x='200' y='180' width='211.3' height='18' rx='3' fill='#2563eb'/><text x='419.27262998305537' y='194' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>20,600</text><text x='188' y='221' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>행렬 연산</text><rect x='200' y='208' width='460.0' height='18' rx='3' fill='#059669'/><text x='668.0' y='222' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>44,852</text><text x='20' y='246' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>회색은 CPU의 열여섯 스레드, 초록은 WebGPU의 표준에 없는 기능을 쓴 커널이다.</text></svg>
