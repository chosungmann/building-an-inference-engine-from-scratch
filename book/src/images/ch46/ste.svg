<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 350' width='900' height='350' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='900' height='350' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>흉내 양자화: 앞으로 갈 때는 계단, 뒤로 올 때는 곧은 선</text><text x='230.0' y='50' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='bold'>순전파: 줄였다 되돌린 값을 쓴다</text><line x1='60' y1='170.0' x2='400' y2='170.0' stroke='#6b7280' stroke-width='1'/><line x1='230.0' y1='60' x2='230.0' y2='280' stroke='#6b7280' stroke-width='1'/><text x='400' y='188.0' fill='#6b7280' font-size='11' text-anchor='end' font-weight='normal'>가중치</text><text x='236.0' y='72' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>쓰는 값</text><path d='M60.0,280.0 L400.0,60.0' fill='none' stroke='#6b7280' stroke-width='1' stroke-dasharray='4,3'/><path d='M60.0,266.2 L102.5,266.2 L102.5,238.8 L145.0,238.8 L145.0,211.2 L187.5,211.2 L187.5,183.8 L230.0,183.8 L230.0,156.2 L272.5,156.2 L272.5,128.8 L315.0,128.8 L315.0,101.2 L357.5,101.2 L357.5,73.8 L400.0,73.8' fill='none' stroke='#d97706' stroke-width='2.5'/><text x='230.0' y='304' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>가중치가 조금 움직여도 결과는 그대로다</text><text x='670.0' y='50' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='bold'>역전파: 계단을 곧은 선으로 친다</text><line x1='500' y1='170.0' x2='840' y2='170.0' stroke='#6b7280' stroke-width='1'/><line x1='670.0' y1='60' x2='670.0' y2='280' stroke='#6b7280' stroke-width='1'/><text x='840' y='188.0' fill='#6b7280' font-size='11' text-anchor='end' font-weight='normal'>가중치</text><text x='676.0' y='72' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>쓰는 값</text><path d='M500.0,266.2 L542.5,266.2 L542.5,238.8 L585.0,238.8 L585.0,211.2 L627.5,211.2 L627.5,183.8 L670.0,183.8 L670.0,156.2 L712.5,156.2 L712.5,128.8 L755.0,128.8 L755.0,101.2 L797.5,101.2 L797.5,73.8 L840.0,73.8' fill='none' stroke='#6b7280' stroke-width='1' stroke-dasharray='4,3'/><path d='M500.0,280.0 L840.0,60.0' fill='none' stroke='#059669' stroke-width='2.5'/><text x='670.0' y='304' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>기울기를 줄이지 않은 가중치에 그대로 준다</text><text x='20' y='334' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>계단의 기울기는 어디서나 0이다. 그대로 미분하면 아무것도 배우지 못한다. 그래서 뒤로 올 때만 계단이 없는 셈 친다.</text></svg>
