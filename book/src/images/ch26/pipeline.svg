<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 930 336' width='930' height='336' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='930' height='336' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>파일에서 실행까지: 계획은 한 번, 실행은 여러 번</text><rect x='20' y='60' width='120' height='62' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='80.0' y='87.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>.tflite 파일</text><text x='80.0' y='107.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>메모리에 비춘다</text><rect x='172' y='60' width='150' height='62' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.5'/><text x='247.0' y='87.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>tflite::Model</text><text x='247.0' y='107.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>FlatBuffers를 따라간다</text><rect x='354' y='60' width='130' height='62' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='419.0' y='87.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>Graph</text><text x='419.0' y='107.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>값과 노드</text><line x1='140' y1='91.0' x2='170' y2='91.0' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='322' y1='91.0' x2='352' y2='91.0' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='484' y1='91.0' x2='514' y2='91.0' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='516.0' y='44.0' width='394.0' height='196.0' rx='8' fill='#ffffff' stroke='#d97706' stroke-width='1.5'/><text x='530' y='64' fill='#d97706' font-size='12' text-anchor='start' font-weight='bold'>Interpreter::with (계획)</text><rect x='528.0' y='76.0' width='22.0' height='22.0' rx='11' fill='#fef3c7' stroke='#d97706' stroke-width='1'/><text x='539' y='92' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>1</text><text x='560' y='92' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>순서를 정하고 커널을 찾는다</text><text x='898' y='92' fill='#6b7280' font-size='10' text-anchor='end' font-weight='normal'>Graph::order, Registry::resolve</text><rect x='528.0' y='108.0' width='22.0' height='22.0' rx='11' fill='#fef3c7' stroke='#d97706' stroke-width='1'/><text x='539' y='124' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>2</text><text x='560' y='124' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>값마다의 형상을 정한다</text><text x='898' y='124' fill='#6b7280' font-size='10' text-anchor='end' font-weight='normal'>Kernel::shapes</text><rect x='528.0' y='140.0' width='22.0' height='22.0' rx='11' fill='#fef3c7' stroke='#d97706' stroke-width='1'/><text x='539' y='156' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>3</text><text x='560' y='156' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>값마다의 수명을 읽는다</text><text x='898' y='156' fill='#6b7280' font-size='10' text-anchor='end' font-weight='normal'>memory::lifetimes</text><rect x='528.0' y='172.0' width='22.0' height='22.0' rx='11' fill='#fef3c7' stroke='#d97706' stroke-width='1'/><text x='539' y='188' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>4</text><text x='560' y='188' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>자리를 나누고 확인한다</text><text x='898' y='188' fill='#6b7280' font-size='10' text-anchor='end' font-weight='normal'>memory::plan, memory::check</text><rect x='528.0' y='204.0' width='22.0' height='22.0' rx='11' fill='#fef3c7' stroke='#d97706' stroke-width='1'/><text x='539' y='220' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>5</text><text x='560' y='220' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>단계마다 읽고 쓰는 자리를 확인한다</text><text x='898' y='220' fill='#6b7280' font-size='10' text-anchor='end' font-weight='normal'>check_steps</text><rect x='516' y='266' width='394' height='54' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='713.0' y='289.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>Interpreter::run (실행)</text><text x='713.0' y='309.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>단계마다 커널을 부른다. 메모리를 얻지 않는다</text><line x1='713.0' y1='240' x2='713.0' y2='264' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><text x='20' y='286' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>왼쪽부터 계획까지는 모델을 열 때 한 번 한다.</text><text x='20' y='304' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>실행은 사진이 들어올 때마다 한다. 정할 것이 남아 있지 않다.</text></svg>
