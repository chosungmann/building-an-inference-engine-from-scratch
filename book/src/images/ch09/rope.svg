-size='13' text-anchor='middle' font-weight='bold'>뒤쪽 짝: 느리게 돈다</text><text x='470' y='282' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>멀리 떨어진 토큰 사이의 거리를 구분</text><text x='700' y='110' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>화살표 옆의 숫자는</text><text x='700' y='128' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>토큰의 위치다.</text><text x='700' y='164' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>두 벡터의 내적은</text><text x='700' y='182' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>각도의 차이, 즉</text><text x='700' y='200' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>위치의 차이에만</text><text x='700' y='218' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>달려 있다.</text></svg>
