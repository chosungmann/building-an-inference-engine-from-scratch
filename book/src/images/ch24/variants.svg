<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 258' width='880' height='258' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='880' height='258' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>새 토큰이 보는 키: 어텐션의 변형들</text><text x='504.0' y='54' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>앞의 토큰들 (왼쪽이 오래된 것)</text><text x='699.0' y='54' fill='#d97706' font-size='11' text-anchor='middle' font-weight='normal'>새 토큰</text><text x='20' y='82' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>전부 본다</text><text x='20' y='100' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>이 책의 모델. 일이 문맥의 길이만큼 는다</text><rect x='330' y='64' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='359' y='64' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='388' y='64' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='417' y='64' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='446' y='64' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='475' y='64' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='504' y='64' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='533' y='64' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='562' y='64' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='591' y='64' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='620' y='64' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='649' y='64' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='686' y='64' width='26' height='26' rx='3' fill='#fef3c7' stroke='#d97706'/><text x='20' y='136' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>가까운 것만 본다 (창)</text><text x='20' y='154' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>일이 창의 크기에서 멈춘다. 그렇게 학습한 모델만</text><rect x='330' y='118' width='26' height='26' rx='3' fill='#f3f4f6' stroke='#e5e7eb'/><rect x='359' y='118' width='26' height='26' rx='3' fill='#f3f4f6' stroke='#e5e7eb'/><rect x='388' y='118' width='26' height='26' rx='3' fill='#f3f4f6' stroke='#e5e7eb'/><rect x='417' y='118' width='26' height='26' rx='3' fill='#f3f4f6' stroke='#e5e7eb'/><rect x='446' y='118' width='26' height='26' rx='3' fill='#f3f4f6' stroke='#e5e7eb'/><rect x='475' y='118' width='26' height='26' rx='3' fill='#f3f4f6' stroke='#e5e7eb'/><rect x='504' y='118' width='26' height='26' rx='3' fill='#f3f4f6' stroke='#e5e7eb'/><rect x='533' y='118' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='562' y='118' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='591' y='118' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='620' y='118' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='649' y='118' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='686' y='118' width='26' height='26' rx='3' fill='#fef3c7' stroke='#d97706'/><text x='20' y='190' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>가까운 것과 몇몇 먼 것</text><text x='20' y='208' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>긴 문서용 모델들. 무엇을 볼지를 정해 둔다</text><rect x='330' y='172' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='359' y='172' width='26' height='26' rx='3' fill='#f3f4f6' stroke='#e5e7eb'/><rect x='388' y='172' width='26' height='26' rx='3' fill='#f3f4f6' stroke='#e5e7eb'/><rect x='417' y='172' width='26' height='26' rx='3' fill='#f3f4f6' stroke='#e5e7eb'/><rect x='446' y='172' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='475' y='172' width='26' height='26' rx='3' fill='#f3f4f6' stroke='#e5e7eb'/><rect x='504' y='172' width='26' height='26' rx='3' fill='#f3f4f6' stroke='#e5e7eb'/><rect x='533' y='172' width='26' height='26' rx='3' fill='#f3f4f6' stroke='#e5e7eb'/><rect x='562' y='172' width='26' height='26' rx='3' fill='#f3f4f6' stroke='#e5e7eb'/><rect x='591' y='172' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='620' y='172' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='649' y='172' width='26' height='26' rx='3' fill='#dbeafe' stroke='#2563eb'/><rect x='686' y='172' width='26' height='26' rx='3' fill='#fef3c7' stroke='#d97706'/><text x='20' y='242' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>파란 칸이 점수를 내고 값을 섞는 대상이다. 무엇을 보는지는 모델이 학습할 때 정해지고, 엔진이 마음대로 줄일 수 없다.</text></svg>
