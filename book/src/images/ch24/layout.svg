<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 250' width='880' height='250' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='880' height='250' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>KV 캐시에 키를 놓는 두 가지 방법 (헤드 둘, 토큰 넷으로 줄여 그렸다)</text><text x='20' y='62' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>22장까지: 토큰마다, 그 안에서 헤드마다</text><rect x='30' y='74' width='84' height='34' rx='4' fill='#dbeafe' stroke='#2563eb'/><text x='72.0' y='96' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 0, 헤드 0</text><rect x='118' y='74' width='84' height='34' rx='4' fill='#fef3c7' stroke='#d97706'/><text x='160.0' y='96' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 0, 헤드 1</text><rect x='206' y='74' width='84' height='34' rx='4' fill='#dbeafe' stroke='#2563eb'/><text x='248.0' y='96' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 1, 헤드 0</text><rect x='294' y='74' width='84' height='34' rx='4' fill='#fef3c7' stroke='#d97706'/><text x='336.0' y='96' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 1, 헤드 1</text><rect x='382' y='74' width='84' height='34' rx='4' fill='#dbeafe' stroke='#2563eb'/><text x='424.0' y='96' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 2, 헤드 0</text><rect x='470' y='74' width='84' height='34' rx='4' fill='#fef3c7' stroke='#d97706'/><text x='512.0' y='96' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 2, 헤드 1</text><rect x='558' y='74' width='84' height='34' rx='4' fill='#dbeafe' stroke='#2563eb'/><text x='600.0' y='96' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 3, 헤드 0</text><rect x='646' y='74' width='84' height='34' rx='4' fill='#fef3c7' stroke='#d97706'/><text x='688.0' y='96' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 3, 헤드 1</text><text x='30' y='128' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>헤드 0의 키를 차례로 읽으려면 하나 걸러 하나씩 건너뛰어야 한다.</text><text x='20' y='168' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>이 장: 헤드마다 따로, 그 안에서 토큰마다</text><rect x='30' y='180' width='84' height='34' rx='4' fill='#dbeafe' stroke='#2563eb'/><text x='72.0' y='202' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 0, 헤드 0</text><rect x='118' y='180' width='84' height='34' rx='4' fill='#dbeafe' stroke='#2563eb'/><text x='160.0' y='202' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 1, 헤드 0</text><rect x='206' y='180' width='84' height='34' rx='4' fill='#dbeafe' stroke='#2563eb'/><text x='248.0' y='202' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 2, 헤드 0</text><rect x='294' y='180' width='84' height='34' rx='4' fill='#dbeafe' stroke='#2563eb'/><text x='336.0' y='202' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 3, 헤드 0</text><rect x='406' y='180' width='84' height='34' rx='4' fill='#fef3c7' stroke='#d97706'/><text x='448.0' y='202' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 0, 헤드 1</text><rect x='494' y='180' width='84' height='34' rx='4' fill='#fef3c7' stroke='#d97706'/><text x='536.0' y='202' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 1, 헤드 1</text><rect x='582' y='180' width='84' height='34' rx='4' fill='#fef3c7' stroke='#d97706'/><text x='624.0' y='202' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 2, 헤드 1</text><rect x='670' y='180' width='84' height='34' rx='4' fill='#fef3c7' stroke='#d97706'/><text x='712.0' y='202' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>토큰 3, 헤드 1</text><text x='30' y='234' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>헤드 하나의 키들이 나란히 놓인다. ‘행이 키인 행렬’이 되어 17장의 커널에 그대로 넣을 수 있다.</text></svg>
