<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 218' width='880' height='218' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='880' height='218' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>블록 하나에서 새 토큰 하나의 어텐션 (앞의 토큰 4,096개, 마이크로초)</text><text x='288' y='65' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>22장까지</text><rect x='300' y='52' width='420.0' height='18' rx='3' fill='#6b7280'/><text x='728.0' y='66' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>2,472</text><text x='288' y='93' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>키를 헤드마다 나란히</text><rect x='300' y='80' width='393.6' height='18' rx='3' fill='#93c5fd'/><text x='701.5598980458794' y='94' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>2,316</text><text x='288' y='121' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>17장의 커널로, 질의를 하나씩</text><rect x='300' y='108' width='224.0' height='18' rx='3' fill='#93c5fd'/><text x='531.9932030586236' y='122' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>1,318</text><text x='288' y='149' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>17장의 커널로, 질의 넷을 한꺼번에</text><rect x='300' y='136' width='147.3' height='18' rx='3' fill='#2563eb'/><text x='455.32370433305016' y='150' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>867</text><text x='288' y='177' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>헤드를 스레드 8개에 나눠</text><rect x='300' y='164' width='19.9' height='18' rx='3' fill='#059669'/><text x='327.86406117247236' y='178' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>117</text><text x='20' y='202' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>처음과 끝이 21배 차이다. 계산하는 것은 같고, 값을 놓는 자리와 곱하는 방법만 바꿨다.</text></svg>
