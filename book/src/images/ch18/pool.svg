<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 342' width='880' height='342' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='880' height='342' rx='8' fill='#ffffff'/><text x='20' y='30' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>스레드 풀: 일 하나가 지나가는 길</text><rect x='20' y='118' width='170' height='64' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='105.0' y='146.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>맡기는 스레드</text><text x='105.0' y='166.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>run(...)을 부른다</text><rect x='250' y='48' width='380' height='252' rx='8' fill='#ffffff' stroke='#6b7280' stroke-width='1.5' stroke-dasharray='6 4'/><text x='266' y='70' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>함께 보는 상태</text><rect x='266' y='82' width='348' height='46' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='440.0' y='101.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>job: 부를 함수와 번호의 수</text><text x='440.0' y='121.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>① 맡기는 쪽이 적는다</text><rect x='266' y='136' width='348' height='46' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='440.0' y='155.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>call: 일의 번호 + 참여할 일꾼의 수</text><text x='440.0' y='175.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>② 맡기는 쪽이 바꾼다  ③ 일꾼이 알아챈다</text><rect x='266' y='190' width='348' height='46' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='440.0' y='209.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>next: 다음에 가져갈 번호</text><text x='440.0' y='229.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>④ 모두가 번호를 하나씩 뽑아 가며 일한다</text><rect x='266' y='244' width='348' height='46' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='440.0' y='263.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>running: 아직 안 끝난 일꾼의 수</text><text x='440.0' y='283.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>⑤ 일꾼이 줄인다  ⑥ 0이면 맡긴 쪽이 돌아간다</text><rect x='690' y='62' width='170' height='60' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='775.0' y='88.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>일꾼 0</text><text x='775.0' y='108.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>일한다</text><rect x='690' y='146' width='170' height='60' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='775.0' y='172.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>일꾼 1</text><text x='775.0' y='192.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>일한다</text><rect x='690' y='230' width='170' height='60' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='775.0' y='256.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>일꾼 2</text><text x='775.0' y='276.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>부르지 않았다: 잔다</text><line x1='190' y1='150' x2='246' y2='150' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='690' y1='92' x2='634' y2='136' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='690' y1='176' x2='634' y2='164' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><text x='20' y='326' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>맡기는 스레드도 ④에서 함께 일한다. 일꾼 2처럼 부르지 않은 일꾼은 깨어날 일이 없다.</text></svg>
