<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 262' width='900' height='262' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='900' height='262' rx='8' fill='#ffffff'/><text x='20' y='30' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>값 32개를 담는 묶음 하나</text><text x='20' y='78' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>Q8_0</text><rect x='90' y='56' width='34' height='34' rx='3' fill='#fef3c7' stroke='#d97706'/><text x='107.0' y='78' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>d</text><rect x='126' y='56' width='574' height='34' rx='3' fill='#dbeafe' stroke='#2563eb'/><text x='413.0' y='78' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>8비트 정수 32개 (-127 ~ 127)</text><text x='712' y='78' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>34바이트, 값 하나에 8.5비트</text><text x='20' y='134' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>Q4_0</text><rect x='90' y='112' width='34' height='34' rx='3' fill='#fef3c7' stroke='#d97706'/><text x='107.0' y='134' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>d</text><rect x='126' y='112' width='286' height='34' rx='3' fill='#d1fae5' stroke='#059669'/><text x='269.0' y='134' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>4비트 정수 32개 (-8 ~ 7)</text><text x='424' y='134' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>18바이트, 값 하나에 4.5비트</text><text x='90' y='172' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>칸 하나가 1바이트다. d는 스케일이고 16비트 실수다. 되돌린 값은 d × 정수.</text><text x='20' y='214' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>Q4_0의 바이트 하나</text><rect x='200' y='194' width='118' height='32' rx='3' fill='#d1fae5' stroke='#059669'/><text x='259' y='215' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>위 4비트</text><rect x='320' y='194' width='118' height='32' rx='3' fill='#d1fae5' stroke='#059669'/><text x='379' y='215' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>아래 4비트</text><text x='259' y='246' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>(i + 16)번째 값</text><text x='379' y='246' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>i번째 값</text><text x='460' y='215' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>저장된 0 ~ 15에서 8을 빼면 -8 ~ 7이 된다.</text></svg>
