<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 240' width='880' height='240' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='880' height='240' rx='8' fill='#ffffff'/><text x='20' y='30' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>묶음 하나의 내적: 정수로 곱하고, 마지막에 한 번 실수로</text><rect x='20' y='60' width='250' height='54' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='145.0' y='83.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>가중치 묶음</text><text x='145.0' y='103.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>스케일 d_w, 정수 32개</text><rect x='20' y='134' width='250' height='54' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='145.0' y='157.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>입력 묶음</text><text x='145.0' y='177.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>스케일 d_x, 정수 32개 (방금 만듦)</text><rect x='340' y='96' width='200' height='56' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='440.0' y='120.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>정수 32쌍의 곱의 합</text><text x='440.0' y='140.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>정수 넷에 나누어 담는다</text><rect x='610' y='96' width='230' height='56' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='725.0' y='120.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>× (d_w × d_x)</text><text x='725.0' y='140.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>f32로 바꿔 합에 더한다</text><line x1='270' y1='87' x2='336' y2='116' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='270' y1='161' x2='336' y2='132' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='540' y1='124' x2='606' y2='124' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><text x='440' y='176' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>정확하다. 순서를 바꿔도 같다.</text><text x='725' y='176' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>반올림이 있다. 순서를 정해 둔다.</text><text x='20' y='222' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>행 하나는 묶음 64개(열 2,048개)다. 곱셈 2,048번 가운데 실수 연산은 묶음마다 몇 번뿐이다.</text></svg>
