<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 404' width='1180' height='404' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='1180' height='404' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>TRANSPOSE를 뒤로 옮겨 마주 보게 한다</text><text x='40' y='62' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>1. 옮긴 그대로</text><text x='40' y='346' fill='#6b7280' font-size='11.5' text-anchor='start' font-weight='normal'>두 갈래가 각각 NCHW로 되돌려진 뒤 더해지고,</text><text x='40' y='363' fill='#6b7280' font-size='11.5' text-anchor='start' font-weight='normal'>다음 합성곱 앞에서 다시 NHWC가 된다.</text><text x='470' y='62' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>2. 뒤로 옮기기</text><text x='470' y='346' fill='#6b7280' font-size='11.5' text-anchor='start' font-weight='normal'>덧셈은 원소가 놓인 순서를 따지지 않는다.</text><text x='470' y='363' fill='#6b7280' font-size='11.5' text-anchor='start' font-weight='normal'>두 입력이 같은 순서로 바뀌어 있으면</text><text x='470' y='380' fill='#6b7280' font-size='11.5' text-anchor='start' font-weight='normal'>바꾸기 전의 값을 더하고 나서 바꿔도 같다.</text><text x='900' y='62' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>3. 상쇄</text><text x='900' y='346' fill='#6b7280' font-size='11.5' text-anchor='start' font-weight='normal'>→NCHW 다음의 →NHWC는 제자리다.</text><text x='900' y='363' fill='#6b7280' font-size='11.5' text-anchor='start' font-weight='normal'>둘 다 지운다.</text><rect x='40.0' y='84.0' width='96.0' height='30.0' rx='5' fill='#dbeafe' stroke='#2563eb' stroke-width='1.3'/><text x='88.0' y='103.0' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>CONV_2D</text><rect x='170.0' y='84.0' width='96.0' height='30.0' rx='5' fill='#dbeafe' stroke='#2563eb' stroke-width='1.3'/><text x='218.0' y='103.0' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>CONV_2D</text><rect x='40.0' y='136.0' width='96.0' height='30.0' rx='5' fill='#fef3c7' stroke='#d97706' stroke-width='1.3'/><text x='88.0' y='155.0' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>→NCHW</text><rect x='170.0' y='136.0' width='96.0' height='30.0' rx='5' fill='#fef3c7' stroke='#d97706' stroke-width='1.3'/><text x='218.0' y='155.0' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>→NCHW</text><line x1='88' y1='114' x2='88' y2='134' stroke='#6b7280' stroke-width='1.2' marker-end='url(#arrow-6b7280)'/><line x1='218' y1='114' x2='218' y2='134' stroke='#6b7280' stroke-width='1.2' marker-end='url(#arrow-6b7280)'/><rect x='105.0' y='190.0' width='96.0' height='30.0' rx='5' fill='#d1fae5' stroke='#059669' stroke-width='1.3'/><text x='153.0' y='209.0' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>ADD</text><line x1='88' y1='166' x2='140' y2='188' stroke='#6b7280' stroke-width='1.2' marker-end='url(#arrow-6b7280)'/><line x1='218' y1='166' x2='166' y2='188' stroke='#6b7280' stroke-width='1.2' marker-end='url(#arrow-6b7280)'/><rect x='105.0' y='240.0' width='96.0' height='30.0' rx='5' fill='#fef3c7' stroke='#d97706' stroke-