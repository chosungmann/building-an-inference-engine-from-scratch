<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1040 242' width='1040' height='242' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='1040' height='242' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>받은 모델을 놓는 차례: 어디에서 멈춰도 쓰던 모델이 남는다</text><rect x='20' y='56' width='150' height='50' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='95.0' y='77.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>크기를 본다</text><text x='95.0' y='97.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>끊긴 내려받기</text><rect x='188' y='56' width='150' height='50' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='263.0' y='77.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>해시를 본다</text><text x='263.0' y='97.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>바뀐 비트</text><line x1='172' y1='81' x2='185' y2='81' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='356' y='56' width='150' height='50' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='431.0' y='77.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>옆 폴더에 차린다</text><text x='431.0' y='97.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>판.partial/</text><line x1='340' y1='81' x2='353' y2='81' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='524' y='56' width='150' height='50' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='599.0' y='77.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>폴더의 이름을 바꾼다</text><text x='599.0' y='97.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>판.partial → 판</text><line x1='508' y1='81' x2='521' y2='81' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='692' y='56' width='150' height='50' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='767.0' y='77.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>current를 바꾼다</text><text x='767.0' y='97.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>한 번의 rename</text><line x1='676' y1='81' x2='689' y2='81' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='860' y='56' width='150' height='50' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.5'/><text x='935.0' y='77.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>돌려 본다</text><text x='935.0' y='97.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>안 되면 되돌린다</text><line x1='844' y1='81' x2='857' y2='81' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='20.0' y='150.0' width='150.0' height='46.0' rx='6' fill='#ffffff' stroke='#dc2626' stroke-width='1' stroke-dasharray='4,3'/><text x='95.0' y='169' fill='#dc2626' font-size='12' text-anchor='middle' font-weight='normal'>거절. 다시 받는다</text><text x='95.0' y='186' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>쓰던 판 그대로</text><line x1='95.0' y1='108' x2='95.0' y2='148' stroke='#6b7280' stroke-width='1' stroke-dasharray='3,3'/><rect x='188.0' y='150.0' width='150.0' height='46.0' rx='6' fill='#ffffff' stroke='#dc2626' stroke-width='1' stroke-dasharray='4,3'/><text x='263.0' y='169' fill='#dc2626' font-size='12' text-anchor='middle' font-weight='normal'>거절. 다시 받는다</text><text x='263.0' y='186' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>쓰던 판 그대로</text><line x1='263.0' y1='108' x2='263.0' y2='148' stroke='#6b7280' stroke-width='1' stroke-dasharray='3,3'/><rect x='356.0' y='150.0' width='150.0' height='46.0' rx='6' fill='#ffffff' stroke='#6b7280' stroke-width='1' stroke-dasharray='4,3'/><text x='431.0' y='169' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>하다 만 폴더가 남는다</text><text x='431.0' y='186' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>다음에 치운다. 쓰던 판 그대로</text><line x1='431.0' y1='108' x2='431.0' y2='148' stroke='#6b7280' stroke-width='1' stroke-dasharray='3,3'/><rect x='524.0' y='150.0' width='150.0' height='46.0' rx='6' fill='#ffffff' stroke='#6b7280' stroke-width='1' stroke-dasharray='4,3'/><text x='599.0' y='169' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>새 판이 놓였지만</text><text x='599.0' y='186' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>아직 쓰던 판을 쓴다</text><line x1='599.0' y1='108' x2='599.0' y2='148' stroke='#6b7280' stroke-width='1' stroke-dasharray='3,3'/><rect x='692.0' y='150.0' width='150.0' height='46.0' rx='6' fill='#ffffff' stroke='#059669' stroke-width='1' stroke-dasharray='4,3'/><text x='767.0' y='169' fill='#059669' font-size='12' text-anchor='middle' font-weight='normal'>이 순간부터 새 판</text><text x='767.0' y='186' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>옛 판은 previous에</text><line x1='767.0' y1='108' x2='767.0' y2='148' stroke='#6b7280' stroke-width='1' stroke-dasharray='3,3'/><rect x='860.0' y='150.0' width='150.0' height='46.0' rx='6' fill='#ffffff' stroke='#7c3aed' stroke-width='1' stroke-dasharray='4,3'/><text x='935.0' y='169' fill='#7c3aed' font-size='12' text-anchor='middle' font-weight='normal'>previous로 돌아간다</text><text x='935.0' y='186' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>옛 판은 지우지 않았다</text><line x1='935.0' y1='108' x2='935.0' y2='148' stroke='#6b7280' stroke-width='1' stroke-dasharray='3,3'/><rect x='14.0' y='122.0' width='216.0' height='20.0' rx='0' fill='#ffffff'/><text x='20' y='136' fill='#1f2933' font-size='12' text-anchor='start' font-weight='bold'>여기에서 실패하거나 앱이 죽으면</text><text x='20' y='226' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>쓰던 판을 건드리는 단계가 없다. 바뀌는 것은 current라는 글 파일 하나이고, 그것도 이름 바꾸기 한 번이다.</text></svg>
