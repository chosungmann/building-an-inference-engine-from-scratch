middle' font-weight='bold'>앱의 코드</text><text x='690.0' y='107.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>Java, Kotlin</text><line x1='690.0' y1='116' x2='690.0' y2='138' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='60' y='142' width='380' height='46' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='250.0' y='161.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>Classifier (Swift 클래스)</text><text x='250.0' y='181.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>오류 숫자 → throw, deinit에서 닫기</text><rect x='500' y='142' width='380' height='46' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='690.0' y='161.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>Badak.Classifier (Java 클래스)</text><text x='690.0' y='181.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>주소를 long으로, close()에서 닫기</text><line x1='250.0' y1='190' x2='250.0' y2='300' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><text x='260.0' y='222' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>badak.h를 그대로 읽는다</text><text x='260.0' y='240' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>(정적 라이브러리 .a)</text><line x1='690.0' y1='190' x2='690.0' y2='212' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='500' y='216' width='380' height='46' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='690.0' y='235.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>JNI 함수 (Rust)</text><text x='690.0' y='255.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>Java_book_badak_Badak_…  배열과 글을 복사해 온다</text><line x1='690.0' y1='264' x2='690.0' y2='300' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><text x='700.0' y='286' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>(동적 라이브러리 .so)</text><rect x='40.0' y='304.0' width='860.0' height='62.0' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='470' y='328' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>문: C 함수 (badak_ffi)</text><text x='470' y='350' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>패닉을 잡는다 · 오류를 숫자로 바꾼다 · 빈 포인터를 걸러 낸다 · 메모리는 만든 쪽이 지운다</text><line x1='470' y1='368' x2='470' y2='390' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='40.0' y='394.0' width='860.0' height='50.0' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='470' y='416' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>엔진: badak_graph, badak_formats, badak_core, badak_image</text><text x='470' y='434' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>맥에서 돌던 것과 같은 Rust 코드. 고친 줄이 없다</text><text x='20' y='470' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>문 위쪽은 운영체제마다 따로 적는다. 문과 그 아래는 한 번만 적는다.</text></svg>
