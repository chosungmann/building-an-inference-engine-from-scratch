<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 226' width='860' height='226' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='860' height='226' rx='8' fill='#ffffff'/><text x='20' y='30' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>곱하고 더하기: 따로 할 때와 한 번에 할 때</text><text x='20' y='85' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>따로</text><rect x='90' y='60' width='110' height='40' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='145.0' y='85.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>x × w</text><line x1='200' y1='80' x2='226' y2='80' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='230' y='60' width='110' height='40' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='285.0' y='85.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>반올림</text><line x1='340' y1='80' x2='366' y2='80' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='370' y='60' width='110' height='40' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='425.0' y='85.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>+ 합</text><line x1='480' y1='80' x2='506' y2='80' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='510' y='60' width='110' height='40' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='565.0' y='85.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>반올림</text><text x='640' y='85' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>연산 둘, 반올림 두 번</text><text x='20' y='155' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>한 번에</text><rect x='90' y='130' width='250' height='40' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='215.0' y='155.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>x × w + 합  (정확한 값)</text><line x1='340' y1='150' x2='506' y2='150' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='510' y='130' width='110' height='40' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='565.0' y='155.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>반올림</text><text x='640' y='155' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>연산 하나, 반올림 한 번</text><text x='20' y='206' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>두 결과는 마지막 자리가 다를 수 있다. 한 번에 하는 쪽이 더 정확하고, 연산의 수가 절반이다.</text></svg>
