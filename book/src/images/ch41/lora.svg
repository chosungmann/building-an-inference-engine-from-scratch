<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 342' width='920' height='342' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='920' height='342' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>LoRA: 얼려 둔 가중치 옆에 작은 행렬 둘</text><rect x='40.0' y='150.0' width='40.0' height='40.0' rx='4' fill='#f3f4f6' stroke='#6b7280' stroke-width='1'/><text x='60' y='175' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>x</text><rect x='190.0' y='70.0' width='140.0' height='140.0' rx='4' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='260' y='136' fill='#1f2933' font-size='18' text-anchor='middle' font-weight='bold'>W</text><text x='260' y='158' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>576 × 576</text><text x='260' y='176' fill='#2563eb' font-size='12' text-anchor='middle' font-weight='normal'>얼려 둔다</text><rect x='190.0' y='250.0' width='140.0' height='22.0' rx='4' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='260' y='266' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>A   8 × 576</text><rect x='390.0' y='226.0' width='22.0' height='70.0' rx='4' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='430' y='266' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>B   576 × 8</text><circle cx='560' cy='170' r='16' fill='#ffffff' stroke='#1f2933' stroke-width='1.5'/><text x='560' y='176' fill='#1f2933' font-size='18' text-anchor='middle' font-weight='bold'>+</text><rect x='640.0' y='150.0' width='40.0' height='40.0' rx='4' fill='#f3f4f6' stroke='#6b7280' stroke-width='1'/><text x='660' y='175' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>y</text><line x1='82' y1='162' x2='186' y2='142' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='82' y1='178' x2='186' y2='258' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='332' y1='140' x2='542' y2='164' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='332' y1='261' x2='386' y2='261' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='414' y1='250' x2='548' y2='184' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><text x='486' y='232' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>× alpha / r</text><line x1='578' y1='170' x2='636' y2='170' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><text x='720' y='110' fill='#1f2933' font-size='12' text-anchor='start' font-weight='bold'>값의 수</text><text x='720' y='132' fill='#2563eb' font-size='12' text-anchor='start' font-weight='normal'>W: 331,776</text><text x='720' y='152' fill='#d97706' font-size='12' text-anchor='start' font-weight='normal'>A와 B: 9,216</text><text x='720' y='184' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>합치기: W + (alpha/r)·B·A를</text><text x='720' y='200' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>한 번 계산해 W 자리에 둔다</text><text x='720' y='224' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>따로 두기: 스텝마다 아래의</text><text x='720' y='240' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>길을 함께 계산한다</text><text x='20' y='326' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>학습시키는 것은 주황색뿐이다. 학습이 끝나면 그 둘이 어댑터가 된다.</text></svg>
