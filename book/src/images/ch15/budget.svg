<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 266' width='820' height='266' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='820' height='266' rx='8' fill='#ffffff'/><text x='20' y='30' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>가중치를 한 번 읽어서 하는 일</text><text x='20' y='100' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>토큰 생성</text><rect x='130' y='70' width='300' height='50' rx='6' fill='#f3f4f6' stroke='#6b7280'/><text x='280' y='100' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>가중치 4.9GB (출력 층 포함)</text><line x1='432' y1='95' x2='478' y2='95' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='484' y='78' width='34' height='34' rx='5' fill='#dbeafe' stroke='#2563eb'/><text x='530' y='92' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>토큰 하나</text><text x='530' y='110' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>읽은 바이트마다 곱셈 0.25번</text><text x='20' y='190' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>프롬프트 처리</text><rect x='130' y='160' width='300' height='50' rx='6' fill='#f3f4f6' stroke='#6b7280'/><text x='280' y='190' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>가중치 3.9GB (블록만)</text><line x1='432' y1='185' x2='478' y2='185' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='484' y='168' width='34' height='34' rx='5' fill='#fef3c7' stroke='#d97706' opacity='1.00'/><rect x='498' y='168' width='34' height='34' rx='5' fill='#fef3c7' stroke='#d97706' opacity='0.88'/><rect x='512' y='168' width='34' height='34' rx='5' fill='#fef3c7' stroke='#d97706' opacity='0.76'/><rect x='526' y='168' width='34' height='34' rx='5' fill='#fef3c7' stroke='#d97706' opacity='0.64'/><rect x='540' y='168' width='34' height='34' rx='5' fill='#fef3c7' stroke='#d97706' opacity='0.52'/><rect x='554' y='168' width='34' height='34' rx='5' fill='#fef3c7' stroke='#d97706' opacity='0.40'/><text x='606' y='182' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>토큰 256개</text><text x='606' y='200' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>읽은 바이트마다 곱셈 64번</text><text x='20' y='248' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>토큰을 하나씩 만들 때는 읽어 온 가중치를 한 번 쓰고 버린다. 묶어서 처리하면 같은 가중치를 토큰 수만큼 다시 쓴다.</text></svg>
