>badak 기본, 채우기</text><rect x='270.0' y='134.0' width='22.8' height='18.0' rx='3' fill='#2563eb'/><text x='298.77769926512156' y='147' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>215</text><text x='262' y='173' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>badak 기본, 이어 붙이기</text><rect x='270.0' y='160.0' width='35.9' height='18.0' rx='3' fill='#2563eb'/><text x='311.91011871113625' y='173' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>339</text><text x='262' y='199' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>badak 빠른 길, 이어 붙이기</text><rect x='270.0' y='186.0' width='241.6' height='18.0' rx='3' fill='#d97706'/><text x='517.6195590729226' y='199' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>2,280</text><line x1='270' y1='78' x2='270' y2='208' stroke='#6b7280' stroke-width='1'/><text x='660' y='66' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>스레드 12개</text><text x='902' y='95' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>ONNX Runtime, 채우고 길이순</text><rect x='910.0' y='82.0' width='127.9' height='18.0' rx='3' fill='#6b7280'/><text x='1043.8722934998366' y='95' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>5,605</text><text x='902' y='121' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>PyTorch, 채우고 길이순</text><rect x='910.0' y='108.0' width='83.7' height='18.0' rx='3' fill='#6b7280'/><text x='999.7263953638708' y='121' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>3,670</text><text x='902' y='147' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>badak 기본, 채우기</text><rect x='910.0' y='134.0' width='50.6' height='18.0' rx='3' fill='#2563eb'/><text x='966.5662070591457' y='147' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>2,216</text><text x='902' y='173' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>badak 기본, 이어 붙이기</text><rect x='910.0' y='160.0' width='76.3' height='18.0' rx='3' fill='#2563eb'/><text x='992.3272973404619' y='173' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>3,345</text><text x='902' y='199' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>badak 빠른 길, 이어 붙이기</text><rect x='910.0' y='186.0' width='300.0' height='18.0' rx='3' fill='#d97706'/><text x='1216.0' y='199' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>13,149</text><line x1='910' y1='78' x2='910' y2='208' stroke='#6b7280' stroke-width='1'/><text x='20' y='232' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>배치의 크기는 모두 32. 막대의 길이는 판 안에서만 견줄 수 있다. 회색은 다른 엔진, 파랑은 NEON 커널, 주황은 SME 커널이다.</text><text x='20' y='250' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>스레드 열둘에서 badak은 배치들을 스레드에 나눴다. 토큰으로 바꾸는 시간은 어느 쪽에도 넣지 않았다.</text></svg>
