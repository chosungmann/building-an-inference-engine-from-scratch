eb' stroke-width='1.5'/><text x='486.0' y='83.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>BERT</text><text x='486.0' y='103.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>배치로</text><line x1='400' y1='87.0' x2='419' y2='87.0' stroke='#2563eb' stroke-width='1.5' marker-end='url(#arrow-2563eb)'/><rect x='574' y='62' width='128' height='50' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='638.0' y='92.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>평균, 길이 1</text><line x1='552' y1='87.0' x2='571' y2='87.0' stroke='#2563eb' stroke-width='1.5' marker-end='url(#arrow-2563eb)'/><rect x='726' y='62' width='128' height='50' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='790.0' y='83.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>색인</text><text x='790.0' y='103.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>벡터들을 쌓는다</text><line x1='704' y1='87.0' x2='723' y2='87.0' stroke='#2563eb' stroke-width='1.5' marker-end='url(#arrow-2563eb)'/><text x='20' y='204' fill='#d97706' font-size='13' text-anchor='start' font-weight='bold'>저지연 조회</text><text x='20' y='222' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>찾을 때</text><rect x='118' y='182' width='128' height='50' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='182.0' y='212.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>질의 하나</text><rect x='270' y='182' width='128' height='50' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='334.0' y='212.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>토크나이저</text><line x1='248' y1='207.0' x2='267' y2='207.0' stroke='#d97706' stroke-width='1.5' marker-end='url(#arrow-d97706)'/><rect x='422' y='182' width='128' height='50' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='486.0' y='203.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>BERT</text><text x='486.0' y='223.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>하나만</text><line x1='400' y1='207.0' x2='419' y2='207.0' stroke='#d97706' stroke-width='1.5' marker-end='url(#arrow-d97706)'/><rect x='574' y='182' width='128' height='50' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='638.0' y='212.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>평균, 길이 1</text><line x1='552' y1='207.0' x2='571' y2='207.0' stroke='#d97706' stroke-width='1.5' marker-end='url(#arrow-d97706)'/><rect x='726' y='182' width='128' height='50' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='790.0' y='203.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>내적, 상위 k개</text><text x='790.0' y='223.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>모든 벡터와</text><line x1='704' y1='207.0' x2='723' y2='207.0' stroke='#d97706' stroke-width='1.5' marker-end='url(#arrow-d97706)'/><line x1='790.0' y1='114' x2='790.0' y2='178' stroke='#6b7280' stroke-width='1.5' marker-end='url(#arrow-6b7280)' stroke-dasharray='5,4'/><text x='798.0' y='150' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>찾을 곳</text><text x='20' y='268' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>대량 처리에서는 초당 몇 글인지(처리량)가, 조회에서는 질의 하나에 몇 밀리초인지(지연 시간)가 중요하다.</text><text x='20' y='286' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>모델과 토크나이저는 같다. 묶는 방법과 스레드를 쓰는 곳이 달라진다.</text></svg>
