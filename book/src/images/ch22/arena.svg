<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 386' width='880' height='386' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='880' height='386' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>아레나: 덩어리 하나에서 차례로 떼어 주고, 한꺼번에 돌려준다</text><text x='136' y='74' fill='#1f2933' font-size='12' text-anchor='end' font-weight='bold'>블록을 계산하는 중</text><text x='136' y='90' fill='#6b7280' font-size='11' text-anchor='end' font-weight='normal'>텐서 둘을 만들었다</text><rect x='150' y='56' width='680' height='40' rx='4' fill='#f3f4f6' stroke='#6b7280'/><rect x='150' y='56' width='86' height='40' fill='#dbeafe' stroke='#2563eb'/><text x='193.0' y='81' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>정규화</text><rect x='236' y='56' width='86' height='40' fill='#dbeafe' stroke='#2563eb'/><text x='279.0' y='81' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>질의</text><line x1='322' y1='118' x2='322' y2='99' stroke='#d97706' stroke-width='2' marker-end='url(#arrow-d97706)'/><text x='322' y='132' fill='#d97706' font-size='11' text-anchor='middle' font-weight='normal'>다음에 내줄 자리</text><text x='408' y='81' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>아직 내주지 않은 자리</text><text x='136' y='174' fill='#1f2933' font-size='12' text-anchor='end' font-weight='bold'>블록의 끝</text><text x='136' y='190' fill='#6b7280' font-size='11' text-anchor='end' font-weight='normal'>텐서 열여섯을 만들었다</text><rect x='150' y='156' width='680' height='40' rx='4' fill='#f3f4f6' stroke='#6b7280'/><rect x='150' y='156' width='86' height='40' fill='#dbeafe' stroke='#2563eb'/><text x='193.0' y='181' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>정규화</text><rect x='236' y='156' width='86' height='40' fill='#dbeafe' stroke='#2563eb'/><text x='279.0' y='181' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>질의</text><rect x='322' y='156' width='43.0' height='40' fill='#dbeafe' stroke='#2563eb'/><text x='343.5' y='181' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>키</text><rect x='365.0' y='156' width='43.0' height='40' fill='#dbeafe' stroke='#2563eb'/><text x='386.5' y='181' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>값</text><rect x='408.0' y='156' width='68.8' height='40' fill='#dbeafe' stroke='#2563eb'/><text x='442.4' y='181' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>…</text><rect x='476.8' y='156' width='223.6' height='40' fill='#dbeafe' stroke='#2563eb'/><text x='588.6' y='181' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>MLP의 중간 결과</text><line x1='700.4' y1='218' x2='700.4' y2='199' stroke='#d97706' stroke-width='2' marker-end='url(#arrow-d97706)'/><text x='700.4' y='232' fill='#d97706' font-size='11' text-anchor='middle' font-weight='normal'>다음에 내줄 자리</text><text x='136' y='274' fill='#1f2933' font-size='12' text-anchor='end' font-weight='bold'>다음 블록의 시작</text><text x='136' y='290' fill='#6b7280' font-size='11' text-anchor='end' font-weight='normal'>수 하나를 0으로 되돌렸다</text><rect x='150' y='256' width='680' height='40' rx='4' fill='#f3f4f6' stroke='#6b7280'/><line x1='150' y1='318' x2='150' y2='299' stroke='#d97706' stroke-width='2' marker-end='url(#arrow-d97706)'/><text x='158' y='316' fill='#d97706' font-size='11' text-anchor='start' font-weight='normal'>다음에 내줄 자리</text><text x='490.0' y='281' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>같은 메모리를 처음부터 다시 쓴다</text><text x='20' y='352' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>얻는 일은 "다음에 내줄 자리"에 크기를 더하는 것이고, 돌려주는 일은 블록이 끝날 때 한 번뿐이다.</text><text x='20' y='370' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>블록이 끝날 때까지는 아무것도 돌려주지 않으므로, 블록이 만드는 텐서를 모두 더한 만큼을 쥔다.</text></svg>
