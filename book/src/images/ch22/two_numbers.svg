<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 262' width='880' height='262' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='880' height='262' rx='8' fill='#ffffff'/><text x='20' y='30' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>프로세스의 메모리를 세는 두 가지 방법</text><rect x='40' y='56' width='560' height='150' rx='8' fill='#ffffff' stroke='#6b7280' stroke-width='1.5' stroke-dasharray='6 4'/><text x='56' y='78' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>지금 실제 메모리에 올라와 있는 쪽들 (올라온 메모리)</text><rect x='60' y='92' width='250' height='96' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='185.0' y='136.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>스스로 만든 값</text><text x='185.0' y='156.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>힙에 계산해 적은 것</text><rect x='330' y='92' width='250' height='96' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='455.0' y='136.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>파일을 비춘 쪽</text><text x='455.0' y='156.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>파일에 같은 내용이 있다</text><text x='185' y='226' fill='#d97706' font-size='12' text-anchor='middle' font-weight='normal'>버리면 되찾을 길이 없다</text><text x='185' y='244' fill='#d97706' font-size='12' text-anchor='middle' font-weight='normal'>→ 운영체제가 지켜야 한다</text><text x='455' y='226' fill='#2563eb' font-size='12' text-anchor='middle' font-weight='normal'>버려도 파일에서 다시 읽으면 된다</text><text x='455' y='244' fill='#2563eb' font-size='12' text-anchor='middle' font-weight='normal'>→ 모자라면 언제든 내준다</text><line x1='620' y1='140' x2='664' y2='140' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='670' y='92' width='190' height='96' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='765.0' y='136.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>지켜야 하는 메모리</text><text x='765.0' y='156.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>주황색 상자만 센다</text></svg>
