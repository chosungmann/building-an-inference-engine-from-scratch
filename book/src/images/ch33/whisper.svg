<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 386' width='920' height='386' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='920' height='386' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>Whisper: 소리를 한 번 읽고, 글을 한 토큰씩 쓴다</text><text x='40' y='52' fill='#1f2933' font-size='12' text-anchor='start' font-weight='bold'>인코더 (소리 하나에 한 번)</text><rect x='40' y='60' width='200' height='44' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='140.0' y='78.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>멜 스펙트로그램</text><text x='140.0' y='98.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>(80, 3000)</text><rect x='40' y='120' width='200' height='44' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='140.0' y='138.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>합성곱 둘</text><text x='140.0' y='158.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>길이를 절반으로</text><line x1='140.0' y1='105' x2='140.0' y2='117' stroke='#1f2933' stroke-width='1.2' marker-end='url(#arrow-1f2933)'/><rect x='40' y='180' width='200' height='44' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='140.0' y='198.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>자리 벡터를 더함</text><text x='140.0' y='218.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>(1500, 384)</text><line x1='140.0' y1='165' x2='140.0' y2='177' stroke='#1f2933' stroke-width='1.2' marker-end='url(#arrow-1f2933)'/><rect x='40' y='240' width='200' height='44' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='140.0' y='258.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>블록 4개</text><text x='140.0' y='278.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>어텐션, MLP</text><line x1='140.0' y1='225' x2='140.0' y2='237' stroke='#1f2933' stroke-width='1.2' marker-end='url(#arrow-1f2933)'/><rect x='40' y='300' width='200' height='44' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='140.0' y='318.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>소리의 벡터 1,500개</text><text x='140.0' y='338.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>하나가 20밀리초</text><line x1='140.0' y1='285' x2='140.0' y2='297' stroke='#1f2933' stroke-width='1.2' marker-end='url(#arrow-1f2933)'/><text x='420' y='52' fill='#1f2933' font-size='12' text-anchor='start' font-weight='bold'>디코더 (토큰마다 한 번)</text><rect x='420' y='60' width='240' height='44' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='540.0' y='78.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>지금까지 쓴 토큰들</text><text x='540.0' y='98.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>시작, 영어, 받아쓰기, … And, so</text><rect x='410.0' y='114.0' width='260.0' height='166.0' rx='8' fill='#ffffff' stroke='#6b7280' stroke-width='1.2'/><rect x='420' y='120' width='240' height='44' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='540.0' y='138.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>셀프 어텐션</text><text x='540.0' y='158.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>쓴 글을 본다 (KV 캐시)</text><rect x='420' y='172' width='240' height='44' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='540.0' y='190.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>교차 어텐션</text><text x='540.0' y='210.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>소리의 벡터를 본다</text><rect x='420' y='224' width='240' height='44' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='540.0' y='251.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>MLP</text><text x='682' y='136' fill='#1f2933' font-size='13' text-anchor='start' font-weight='bold'>× 4</text><line x1='540' y1='105' x2='540' y2='112' stroke='#1f2933' stroke-width='1.2' marker-end='url(#arrow-1f2933)'/><rect x='420' y='294' width='240' height='44' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.5'/><text x='540.0' y='312.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>다음 토큰의 점수</text><text x='540.0' y='332.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>51,865개</text><line x1='540' y1='282' x2='540' y2='291' stroke='#1f2933' stroke-width='1.2' marker-end='url(#arrow-1f2933)'/><path d='M 242 322.0 C 350 322.0, 310 194.0, 417 194.0' fill='none' stroke='#d97706' stroke-width='1.8' marker-end='url(#arrow-d97706)'/><text x='254' y='344.0' fill='#d97706' font-size='11' text-anchor='start' font-weight='normal'>키와 값은 한 번만 만들어 둔다</text><path d='M 662 316.0 L 760 316.0 L 760 82.0 L 664 82.0' fill='none' stroke='#7c3aed' stroke-width='1.5' stroke-dasharray='5 3' marker-end='url(#arrow-1f2933)'/><text x='770' y='191.0' fill='#7c3aed' font-size='11' text-anchor='start' font-weight='normal'>고른 토큰을</text><text x='770' y='207.0' fill='#7c3aed' font-size='11' text-anchor='start' font-weight='normal'>다음 입력으로</text><text x='770' y='229.0' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>끝 토큰이</text><text x='770' y='243.0' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>나올 때까지</text><text x='20' y='368' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>인코더는 32장의 ViT와, 디코더는 2부의 Llama와 뼈대가 같다. 둘을 잇는 것이 교차 어텐션이다. 질의는 글에서, 키와 값은 소리에서 온다.</text></svg>
