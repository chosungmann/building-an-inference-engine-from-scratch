 y='204' fill='#6b7280' font-size='11' text-anchor='start' font-weight='normal'>회색: 캐시에 있는 토큰.  색: 이번 스텝의 새 토큰.</text><text x='390' y='52' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='bold'>한 텐서 (다섯 줄)</text><rect x='330.0' y='62.0' width='120.0' height='20.0' rx='3' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='390' y='76' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>글 가</text><rect x='330.0' y='86.0' width='120.0' height='20.0' rx='3' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='390' y='100' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>글 나</text><rect x='330.0' y='110.0' width='120.0' height='20.0' rx='3' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='390' y='124' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>글 다</text><rect x='330.0' y='134.0' width='120.0' height='20.0' rx='3' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='390' y='148' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>글 다</text><rect x='330.0' y='158.0' width='120.0' height='20.0' rx='3' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='390' y='172' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>글 다</text><line x1='280' y1='122' x2='322' y2='122' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='520' y='48' width='300' height='46' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='670.0' y='67.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>질의·키·값 만들기</text><text x='670.0' y='87.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>선형 층. 다섯 줄을 한 번에</text><rect x='520' y='108' width='300' height='46' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='670.0' y='127.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>앞 토큰들과 견줘 섞기</text><text x='670.0' y='147.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>줄마다 제 글의 캐시에서</text><line x1='670' y1='94' x2='670' y2='105' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='520' y='168' width='300' height='46' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='670.0' y='187.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>모으기, MLP</text><text x='670.0' y='207.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>선형 층. 다섯 줄을 한 번에</text><line x1='670' y1='154' x2='670' y2='165' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><rect x='520' y='228' width='300' height='46' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='670.0' y='247.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>출력 층</text><text x='670.0' y='267.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>글마다 마지막 줄만. 세 줄을 한 번에</text><line x1='670' y1='214' x2='670' y2='225' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='458' y1='122' x2='512' y2='122' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><text x='20' y='304' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>초록 단계는 줄이 어느 글의 것인지 모른다. 가중치를 한 번 읽어 모든 줄에 쓴다. 글을 가리는 곳은 주황 단계 하나다.</text></svg>
