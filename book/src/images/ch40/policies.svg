 text-anchor='start' font-weight='bold'>연속 배칭</text><rect x='150.0' y='292.0' width='257.0' height='24.0' rx='4' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='280.0' y='309' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>요청 1</text><rect x='176.0' y='322.0' width='101.0' height='24.0' rx='4' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='228.0' y='339' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>요청 2</text><rect x='202.0' y='352.0' width='179.0' height='24.0' rx='4' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='293.0' y='369' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>요청 3</text><rect x='280.0' y='322.0' width='127.0' height='24.0' rx='4' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.5'/><text x='345.0' y='339' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>요청 4</text><rect x='254.0' y='382.0' width='23.0' height='12.0' rx='0' fill='#f3f4f6' stroke='#7c3aed' stroke-width='1'/><text x='248' y='392' fill='#6b7280' font-size='10' text-anchor='end' font-weight='normal'>4</text><rect x='384.0' y='352.0' width='153.0' height='24.0' rx='4' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='462.0' y='369' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>요청 5</text><rect x='306.0' y='398.0' width='75.0' height='12.0' rx='0' fill='#f3f4f6' stroke='#2563eb' stroke-width='1'/><text x='300' y='408' fill='#6b7280' font-size='10' text-anchor='end' font-weight='normal'>5</text><text x='140' y='309' fill='#6b7280' font-size='11' text-anchor='end' font-weight='normal'>자리 1</text><text x='140' y='339' fill='#6b7280' font-size='11' text-anchor='end' font-weight='normal'>자리 2</text><text x='140' y='369' fill='#6b7280' font-size='11' text-anchor='end' font-weight='normal'>자리 3</text><text x='110' y='392' fill='#6b7280' font-size='11' text-anchor='end' font-weight='normal'>기다림</text><text x='384' y='446' fill='#6b7280' font-size='11' text-anchor='middle' font-weight='normal'>스텝마다 끝난 요청은 내리고, 빈 자리가 있으면 바로 태운다</text><text x='20' y='472' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>가로축은 스텝(순전파 한 번)이다. 회색 막대는 요청이 도착해서 탈 때까지 기다린 시간이다.</text></svg>
