ext x='350.0' y='68' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>2.0</text><line x1='470.0' y1='75' x2='470.0' y2='85' stroke='#1f2933' stroke-width='1.5'/><text x='470.0' y='68' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>3.0</text><line x1='590.0' y1='75' x2='590.0' y2='85' stroke='#1f2933' stroke-width='1.5'/><text x='590.0' y='68' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>4.0</text><line x1='710.0' y1='75' x2='710.0' y2='85' stroke='#1f2933' stroke-width='1.5'/><text x='710.0' y='68' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>5.0</text><line x1='830.0' y1='75' x2='830.0' y2='85' stroke='#1f2933' stroke-width='1.5'/><text x='830.0' y='68' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>6.0</text><line x1='58' y1='170' x2='886' y2='170' stroke='#7c3aed' stroke-width='1.5' marker-end='url(#arrow-7c3aed)'/><text x='50' y='175' fill='#7c3aed' font-size='12' text-anchor='end' font-weight='normal'>정수</text><line x1='110.0' y1='165' x2='110.0' y2='175' stroke='#7c3aed' stroke-width='1.5'/><text x='110.0' y='192' fill='#7c3aed' font-size='11' text-anchor='middle' font-weight='normal'>-128</text><line x1='110.0' y1='86' x2='110.0' y2='164' stroke='#6b7280' stroke-width='0.8' stroke-dasharray='3 3'/><line x1='290.70588235294116' y1='165' x2='290.70588235294116' y2='175' stroke='#7c3aed' stroke-width='1.5'/><text x='290.70588235294116' y='192' fill='#7c3aed' font-size='11' text-anchor='middle' font-weight='normal'>-64</text><line x1='290.70588235294116' y1='86' x2='290.70588235294116' y2='164' stroke='#6b7280' stroke-width='0.8' stroke-dasharray='3 3'/><line x1='471.4117647058823' y1='165' x2='471.4117647058823' y2='175' stroke='#7c3aed' stroke-width='1.5'/><text x='471.4117647058823' y='192' fill='#7c3aed' font-size='11' text-anchor='middle' font-weight='normal'>0</text><line x1='471.4117647058823' y1='86' x2='471.4117647058823' y2='164' stroke='#6b7280' stroke-width='0.8' stroke-dasharray='3 3'/><line x1='652.1176470588235' y1='165' x2='652.1176470588235' y2='175' stroke='#7c3aed' stroke-width='1.5'/><text x='652.1176470588235' y='192' fill='#7c3aed' font-size='11' text-anchor='middle' font-weight='normal'>64</text><line x1='652.1176470588235' y1='86' x2='652.1176470588235' y2='164' stroke='#6b7280' stroke-width='0.8' stroke-dasharray='3 3'/><line x1='830.0' y1='165' x2='830.0' y2='175' stroke='#7c3aed' stroke-width='1.5'/><text x='830.0' y='192' fill='#7c3aed' font-size='11' text-anchor='middle' font-weight='normal'>127</text><line x1='830.0' y1='86' x2='830.0' y2='164' stroke='#6b7280' stroke-width='0.8' stroke-dasharray='3 3'/><text x='860' y='216' fill='#d97706' font-size='10' text-anchor='middle' font-weight='normal'>6보다 큰 값은</text><text x='860' y='228' fill='#d97706' font-size='10' text-anchor='middle' font-weight='normal'>127로 잘린다</text><text x='88' y='216' fill='#d97706' font-size='10' text-anchor='middle' font-weight='normal'>0보다 작은 값은</text><text x='88' y='228' fill='#d97706' font-size='10' text-anchor='middle' font-weight='normal'>−128로 잘린다</text><text x='386.0' y='124' fill='#1f2933' font-size='12' text-anchor='middle' font-weight='normal'>한 칸의 폭이 스케일: 6 / 255 = 0.0235</text><text x='20' y='254' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>ReLU6 뒤의 값(0에서 6 사이)을 담는 경우다. 스케일 0.0235, 영점 −128. 실수 = 스케일 × (정수 − 영점).</text><text x='20' y='272' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>영점은 실수 0이 놓이는 정수다. 0을 오차 없이 나타낼 수 있어야 패딩과 ReLU가 정확하다.</text></svg>
