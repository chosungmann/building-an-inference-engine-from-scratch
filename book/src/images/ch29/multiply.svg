<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 930 348' width='930' height='348' font-family='-apple-system, Segoe UI, Noto Sans KR, sans-serif' font-size='14'><defs><marker id='arrow-1f2933' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker><marker id='arrow-6b7280' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='arrow-2563eb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='arrow-d97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='arrow-059669' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#059669'/></marker></defs><rect width='930' height='348' rx='8' fill='#ffffff'/><text x='20' y='28' fill='#1f2933' font-size='14' text-anchor='start' font-weight='bold'>실수를 곱하는 일을 정수로: 배율 = (31비트 정수) × 2의 거듭제곱</text><rect x='30' y='70' width='190' height='56' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='125.0' y='94.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>누산값</text><text x='125.0' y='114.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>32비트 정수</text><rect x='270' y='70' width='220' height='56' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.5'/><text x='380.0' y='94.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>× 배율의 가수</text><text x='380.0' y='114.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>0.5 이상 1 미만을 2³¹배한 정수</text><rect x='540' y='70' width='170' height='56' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='625.0' y='94.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>64비트 곱</text><text x='625.0' y='114.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>값이 2³¹배 커져 있다</text><rect x='760' y='70' width='140' height='56' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/><text x='830.0' y='94.0' fill='#1f2933' font-size='14' text-anchor='middle' font-weight='bold'>오른쪽으로 옮김</text><text x='830.0' y='114.0' fill='#6b7280' font-size='12' text-anchor='middle' font-weight='normal'>31 − 지수 칸</text><line x1='220' y1='98' x2='268' y2='98' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='490' y1='98' x2='538' y2='98' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><line x1='710' y1='98' x2='758' y2='98' stroke='#1f2933' stroke-width='1.5' marker-end='url(#arrow-1f2933)'/><text x='20' y='166' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>예: 배율 0.000731 = 0.7485 × 2⁻¹⁰. 가수는 0.7485 × 2³¹ = 1,607,486,000, 지수는 −10.</text><text x='20' y='186' fill='#1f2933' font-size='12' text-anchor='start' font-weight='normal'>누산값 12,345에 곱하면 12,345 × 1,607,486,000을 41칸(31 + 10) 오른쪽으로 옮겨 9가 된다. 12,345 × 0.000731 = 9.02.</text><text x='20' y='222' fill='#1f2933' font-size='12' text-anchor='start' font-weight='bold'>옮기면서 버려지는 자리를 어떻게 반올림하느냐가 세 가지다</text><rect x='20.0' y='236.0' width='150.0' height='22.0' rx='4' fill='#ede9fe' stroke='#7c3aed' stroke-width='1'/><text x='95' y='251' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>한 번</text><text x='184' y='251' fill='#1f2933' font-size='11' text-anchor='start' font-weight='normal'>64비트 곱에 절반을 더하고 한 번에 옮긴다</text><text x='900' y='251' fill='#6b7280' font-size='11' text-anchor='end' font-weight='normal'>합성곱, 덧셈</text><rect x='20.0' y='262.0' width='150.0' height='22.0' rx='4' fill='#ede9fe' stroke='#7c3aed' stroke-width='1'/><text x='95' y='277' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>두 번</text><text x='184' y='277' fill='#1f2933' font-size='11' text-anchor='start' font-weight='normal'>위쪽 32비트를 반올림해 얻고, 다시 옮기며 반올림한다</text><text x='900' y='277' fill='#6b7280' font-size='11' text-anchor='end' font-weight='normal'>깊이별 합성곱, 평균</text><rect x='20.0' y='288.0' width='150.0' height='22.0' rx='4' fill='#ede9fe' stroke='#7c3aed' stroke-width='1'/><text x='95' y='303' fill='#1f2933' font-size='11' text-anchor='middle' font-weight='normal'>두 번, 큰 쪽으로</text><text x='184' y='303' fill='#1f2933' font-size='11' text-anchor='start' font-weight='normal'>두 번 모두 절반을 큰 쪽으로 보낸다</text><text x='900' y='303' fill='#6b7280' font-size='11' text-anchor='end' font-weight='normal'>선형 층</text><text x='20' y='332' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>수학으로는 같은 계산이고 결과가 드물게 1씩 다르다. 오른쪽은 LiteRT의 자체 커널이 그 방법을 쓰는 연산이다(29.7절).</text></svg>
