-weight='normal'>차례 1</text><rect x='80.0' y='84.0' width='0.9' height='22.0' rx='0' fill='#dbeafe' stroke='#2563eb' stroke-width='1'/><rect x='80.9' y='84.0' width='352.7' height='22.0' rx='0' fill='#d97706'/><text x='441.6797454931071' y='100' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>758토큰 가운데 756개</text><text x='660' y='100' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='bold'>2099</text><text x='760' y='100' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>2141</text><text x='70' y='132' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>차례 2</text><rect x='80.0' y='116.0' width='368.1' height='22.0' rx='0' fill='#dbeafe' stroke='#2563eb' stroke-width='1'/><rect x='448.1' y='116.0' width='8.4' height='22.0' rx='0' fill='#d97706'/><text x='464.542948038176' y='132' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>807토큰 가운데 18개</text><text x='660' y='132' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='bold'>57</text><text x='760' y='132' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>2243</text><text x='70' y='164' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>차례 3</text><rect x='80.0' y='148.0' width='390.1' height='22.0' rx='0' fill='#dbeafe' stroke='#2563eb' stroke-width='1'/><rect x='470.1' y='148.0' width='7.5' height='22.0' rx='0' fill='#d97706'/><text x='485.53976670201484' y='164' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>852토큰 가운데 16개</text><text x='660' y='164' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='bold'>52</text><text x='760' y='164' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>2366</text><text x='70' y='196' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>차례 4</text><rect x='80.0' y='180.0' width='412.0' height='22.0' rx='0' fill='#dbeafe' stroke='#2563eb' stroke-width='1'/><rect x='492.0' y='180.0' width='8.4' height='22.0' rx='0' fill='#d97706'/><text x='508.4029692470838' y='196' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>901토큰 가운데 18개</text><text x='660' y='196' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='bold'>57</text><text x='760' y='196' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>2512</text><text x='70' y='228' fill='#1f2933' font-size='12' text-anchor='end' font-weight='normal'>차례 5</text><rect x='80.0' y='212.0' width='432.1' height='22.0' rx='0' fill='#dbeafe' stroke='#2563eb' stroke-width='1'/><rect x='512.1' y='212.0' width='7.9' height='22.0' rx='0' fill='#d97706'/><text x='528.0' y='228' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>943토큰 가운데 17개</text><text x='660' y='228' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='bold'>56</text><text x='760' y='228' fill='#1f2933' font-size='13' text-anchor='middle' font-weight='normal'>2644</text><text x='20' y='264' fill='#6b7280' font-size='12' text-anchor='start' font-weight='normal'>첫 차례는 캐시가 비어 있어 둘이 같다. 그 뒤로는 새로 온 말만 읽는다. 쓰지 않으면 대화가 길어질수록 느려진다.</text></svg>
