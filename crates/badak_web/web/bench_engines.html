<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>웹 엔진 비교 측정</title>
<style>body { font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; margin: 1em; color-scheme: light dark; }</style></head>
<body>측정하는 중…
<script type="module">
// 50장의 측정. 같은 모델(SmolLM2-135M-Instruct)에 같은 질문을 하고 같은 수의
// 토큰을 쓰게 한다. 엔진은 넷이다: badak, Transformers.js, ONNX Runtime Web,
// WebLLM. scripts/bench_ch50.sh 가 브라우저마다 이 페이지를 연다.
//
// 엔진과 모델은 scripts/download_ch50.sh 가 받아 둔 것을 이 기계의 서버
// (scripts/serve_web.py)에서 받는다. 서버가 내준 바이트를 세어 주므로, 엔진이
// 무엇을 얼마나 받아 갔는지도 적는다.
import { detect, pick } from './features.js';
import { sources, start, SYSTEM } from './setup.js';

const params = new URLSearchParams(location.search);
const name = params.get('name') ?? 'engines';
const only = params.get('only')?.split(',');
const NEW_TOKENS = 96;
const QUESTION = 'Write a short story about a robot learning to paint.';
const MESSAGES = [{ role: 'system', content: SYSTEM }, { role: 'user', content: QUESTION }];
// 긴 프롬프트. 첫 토큰이 나올 때까지의 시간(프롬프트를 읽는 속도)을 본다.
const PASSAGE = `An inference engine is a program that runs a trained neural network. It does not train the network. It loads the numbers that training produced, takes an input, and computes the output as quickly as the machine allows. Most of the work is multiplying matrices, so most of the engineering is about doing those multiplications well: laying the numbers out so the processor can reach them quickly, using the wide registers that modern processors have, splitting the work across cores, and moving the largest multiplications to a graphics processor when one is available. The rest is bookkeeping. The engine has to read model files written by other tools, keep track of what it has already computed so that it does not compute it twice, and fit everything into the memory the device has. On a phone or in a web browser that last part is often the hardest. The same engine can be measured in two ways. One is how long the first word takes to appear after a question is asked. The other is how many words per second follow it. A good engine pays attention to both.`;
const LONG = [{ role: 'system', content: SYSTEM }, { role: 'user', content: `${PASSAGE}\n\nSummarize the passage above in one sentence.` }];
const MODULES = '/third_party/web/node_modules';
const HF = '/models/ch50/hf/';
const MODEL = 'HuggingFaceTB/SmolLM2-135M-Instruct';

const KEY = `badak-engines-${name}-${params.get('run') ?? ''}`;
const state = JSON.parse(sessionStorage.getItem(KEY) ?? '{"lines":[],"finished":[],"running":null}');
const lines = state.lines;
const save = () => sessionStorage.setItem(KEY, JSON.stringify(state));
let sending = Promise.resolve();
const say = (line) => {
  lines.push(line);
  save();
  document.body.textContent = lines.join('\n');
  const body = lines.join('\n') + '\n';
  sending = sending.then(() => fetch(`/report?name=${name}`, { method: 'POST', body })).catch(() => {});
};
const rest = (ms = 3000) => new Promise((resolve) => setTimeout(resolve, ms));
// 서버가 지난번에 물은 뒤로 내준 것. 엔진의 것과 모델의 것으로 나눠 센다.
async function served() {
  const files = await (await fetch('/served', { method: 'POST' })).json();
  // 코드(.js, .mjs, .wasm)는 엔진의 것, 나머지 가운데 /models/ 아래의 것은
  // 모델의 것이다. WebLLM은 모델마다 코드(.wasm)가 따로 있는데 그것도 엔진의
  // 것으로 센다.
  let [runtime, packed, model] = [0, 0, 0];
  const modules = [];
  for (const [path, [bytes, squeezed]] of Object.entries(files)) {
    if (/\.(js|mjs|wasm)$/.test(path)) {
      runtime += bytes;
      packed += squeezed;
      if (path.endsWith('.wasm')) modules.push(path.split('/').at(-1));
    } else if (path.startsWith('/models/')) model += bytes;
  }
  return { runtime, packed, model, modules: modules.sort().join(',') || 'none' };
}

// 엔진 하나를 잰다. make는 { ask, close }를 돌려준다. ask는 질문 하나에 답하며
// 토큰이 나올 때마다 onToken을 부르고 쓴 글을 돌려준다. 두 번 묻고(첫 번째는
// 준비 운동), 둘 다 적는다.
async function measure(label, seconds, make) {
  if (only && !only.includes(label.split(' ')[0])) return;
  if (state.finished.includes(label)) return;
  if (state.running === label) {
    say(`reloaded ${label}`);
  } else {
    state.running = label;
    save();
    await rest();
    await served();
    let timer = null;
    const late = new Promise((resolve) => {
      timer = setTimeout(() => resolve('late'), seconds * 1000);
    });
    const work = (async () => {
      const began = performance.now();
      const engine = await make();
      const loaded = performance.now() - began;
      const bytes = await served();
      const runs = [];
      let text = '';
      const once = async (messages, most) => {
        const times = [];
        const started = performance.now();
        const answer = await engine.ask(messages, most, () => times.push(performance.now() - started));
        const total = performance.now() - started;
        const rate = times.length > 1 ? ((times.length - 1) / (times.at(-1) - times[0])) * 1000 : 0;
        return { first: times[0] ?? total, total, tokens: times.length, rate, answer };
      };
      for (let round = 0; round < 2; round++) {
        await rest(round ? 3000 : 0);
        runs.push(await once(MESSAGES, NEW_TOKENS));
        text = runs.at(-1).answer;
      }
      // 긴 프롬프트는 두 번 묻고 빠른 쪽을 적는다.
      let long = Infinity;
      for (let round = 0; round < 2; round++) {
        await rest();
        long = Math.min(long, (await once(LONG, 8)).first);
      }
      const [cold, warm] = runs;
      say(`engine ${label} load-ms ${loaded.toFixed(0)} runtime-bytes ${bytes.runtime} runtime-gzip ${bytes.packed} model-bytes ${bytes.model} first-ms ${cold.first.toFixed(0)} per-s ${cold.rate.toFixed(1)} again-first-ms ${warm.first.toFixed(0)} again-per-s ${warm.rate.toFixed(1)} long-first-ms ${long.toFixed(0)} tokens ${warm.tokens} wasm ${bytes.modules} text ${JSON.stringify(text.slice(0, 70))}`);
      await engine.close?.();
    })();
    try {
      if ((await Promise.race([work, late])) === 'late') say(`timed-out ${label} (${seconds}초)`);
    } catch (error) {
      say(`failed ${label} ${String(error?.message ?? error).slice(0, 200)}`);
    }
    clearTimeout(timer);
  }
  state.finished.push(label);
  state.running = null;
  save();
  // 다음 엔진은 페이지를 다시 읽고 시작한다. 그래야 앞의 엔진이 받아 둔
  // 코드를 이어 쓰지 않고, 엔진마다 받는 양을 처음부터 센다.
  await sending;
  location.reload();
  await new Promise(() => {});
}

const features = detect();
if (lines.length === 0) {
  say(`agent ${navigator.userAgent}`);
  say(`features simd ${features.simd} relaxed ${features.relaxed} isolated ${features.threads} cores ${features.cores} jspi ${typeof WebAssembly.Suspending === 'function'} webgpu ${'gpu' in navigator}`);
}

// 어느 모델을 잴지. small은 SmolLM2-135M, large는 Llama 3.2 1B.
const group = params.get('group') ?? 'small';

// 1. badak. CPU만 쓰는 것(48장)과, 큰 일만 GPU에 보내는 것(49장).
const BADAK = { small: ['smollm2_135m', sources(true).llm], large: ['llama32_1b', null] }[group];
const badakFiles = BADAK[1] ?? ['config.json', 'tokenizer.json', 'model.safetensors'].map((file) => ({
  path: `${BADAK[0]}/${file}`, url: `/models/${BADAK[0]}/${file}`,
}));
for (const [label, threads, mode] of [['cpu', 4, 0], ['cpu', 8, 0], ['gpu', 8, 2]]) {
  await measure(`badak ${label} threads ${threads}`, 300, async () => {
    const engine = await start({ build: pick(features), threads, gpu: mode > 0, features });
    for (const file of badakFiles) await engine.badak.call('file', { ...file, sha256: undefined, keep: false });
    await engine.badak.call('open', { path: `/${BADAK[0]}` });
    for (const { path } of badakFiles) await engine.badak.call('forget', { path });
    // 입력 벡터가 32개 이상인 일(프롬프트)만 GPU에 보낸다.
    if (mode > 0) await engine.badak.call('offload', { mode, minCount: 32 });
    return {
      async ask(messages, most, onToken) {
        let text = '';
        await engine.badak.call('chat', { system: messages[0].content, question: messages[1].content, maxTokens: most }, (message) => {
          text += message.text;
          onToken();
        });
        return text;
      },
      close: () => engine.badak.stop(),
    };
  });
}

// 2. Transformers.js. ONNX Runtime Web 위에서 돈다.
async function transformers() {
  const T = await import(`${MODULES}/@huggingface/transformers/dist/transformers.min.js`);
  T.env.allowRemoteModels = false;
  T.env.allowLocalModels = true;
  T.env.localModelPath = HF;
  T.env.useBrowserCache = false;
  T.env.backends.onnx.wasm.wasmPaths = `${MODULES}/@huggingface/transformers/node_modules/onnxruntime-web/dist/`;
  return T;
}
const TRANSFORMERS = group === 'small'
  ? [['wasm', 'fp16', 0], ['wasm', 'fp16', 8], ['wasm', 'q4', 8], ['wasm', 'q4f16', 8], ['webgpu', 'fp16', 0], ['webgpu', 'q4f16', 0]]
  : [];
for (const [device, dtype, threads] of TRANSFORMERS) {
  await measure(`transformers ${device} ${dtype} threads ${threads || 'default'}`, 300, async () => {
    const T = await transformers();
    if (threads) T.env.backends.onnx.wasm.numThreads = threads;
    const generator = await T.pipeline('text-generation', MODEL, { device, dtype });
    return {
      async ask(messages, most, onToken) {
        let text = '';
        const streamer = new T.TextStreamer(generator.tokenizer, {
          skip_prompt: true,
          callback_function: (piece) => (text += piece),
          token_callback_function: onToken,
        });
        await generator(messages, { max_new_tokens: most, min_new_tokens: most, do_sample: false, streamer });
        return text;
      },
      close: () => generator.dispose(),
    };
  });
}

// 3. ONNX Runtime Web을 바로 부른다. 토큰을 고르는 일은 여기에서 한다.
const half = (bits) => {
  const [sign, exponent, fraction] = [bits >> 15 ? -1 : 1, (bits >> 10) & 31, bits & 1023];
  if (exponent === 0) return sign * 2 ** -14 * (fraction / 1024);
  if (exponent === 31) return fraction ? NaN : sign * Infinity;
  return sign * 2 ** (exponent - 15) * (1 + fraction / 1024);
};
const ONNXRUNTIME = group === 'small'
  ? [['wasm', 'model_fp16.onnx', 0], ['wasm', 'model_fp16.onnx', 8], ['webgpu', 'model_fp16.onnx', 0]]
  : [];
for (const [provider, file, threads] of ONNXRUNTIME) {
  await measure(`onnxruntime ${provider} ${file} threads ${threads || 'default'}`, 300, async () => {
    // 토크나이저는 Transformers.js의 것을 빌린다. 그것을 읽느라 받은 것은 이
    // 엔진의 것으로 세지 않는다.
    const T = await transformers();
    const tokenizer = await T.AutoTokenizer.from_pretrained(MODEL);
    const encode = (messages) => Array.from(
      tokenizer.encode(tokenizer.apply_chat_template(messages, { tokenize: false, add_generation_prompt: true }), { add_special_tokens: false }),
      Number);
    await served();
    // CPU만 쓸 때는 CPU용 묶음을, GPU를 쓸 때는 WebGPU용 묶음을 읽는다. 받는
    // 모듈의 크기가 다르다.
    const ort = await import(`${MODULES}/onnxruntime-web/dist/ort.${provider === 'webgpu' ? 'webgpu' : 'wasm'}.min.mjs`);
    ort.env.wasm.wasmPaths = `${MODULES}/onnxruntime-web/dist/`;
    if (threads) ort.env.wasm.numThreads = threads;
    // SmolLM2-135M은 블록이 서른 개다. 블록마다 키와 값의 캐시가 있다.
    const names = (prefix) => Array.from({ length: 30 }, (_, layer) => [`${prefix}.${layer}.key`, `${prefix}.${layer}.value`]).flat();
    const [pasts, presents] = [names('past_key_values'), names('present')];
    const session = await ort.InferenceSession.create(`${HF}${MODEL}/onnx/${file}`, {
      executionProviders: [provider],
      // GPU에서는 캐시(present.*)를 CPU로 읽어 오지 않고 GPU에 둔다.
      ...(provider === 'webgpu' ? { preferredOutputLocation: Object.fromEntries(presents.map((output) => [output, 'gpu-buffer'])) } : {}),
    });
    const wide = file.includes('fp16') || file.includes('f16') ? 'float16' : 'float32';
    const empty = () => new ort.Tensor(wide, wide === 'float16' ? new Uint16Array(0) : new Float32Array(0), [1, 3, 0, 64]);
    const integers = (values) => new ort.Tensor('int64', BigInt64Array.from(values, BigInt), [1, values.length]);
    return {
      async ask(messages, most, onToken) {
        let cache = Object.fromEntries(pasts.map((input) => [input, empty()]));
        let ids = encode(messages);
        let seen = 0;
        const written = [];
        for (let step = 0; step < most; step++) {
          const feeds = { input_ids: integers(ids), attention_mask: integers(new Array(seen + ids.length).fill(1)), ...cache };
          if (session.inputNames.includes('position_ids')) feeds.position_ids = integers(ids.map((_, index) => seen + index));
          const outputs = await session.run(feeds);
          const logits = outputs.logits;
          const vocabulary = logits.dims[2];
          const last = logits.data.subarray((logits.dims[1] - 1) * vocabulary, logits.dims[1] * vocabulary);
          let [best, score] = [0, -Infinity];
          for (let token = 0; token < vocabulary; token++) {
            const value = logits.type === 'float16' && !(last instanceof Float32Array) && last.BYTES_PER_ELEMENT === 2 && !(globalThis.Float16Array && last instanceof globalThis.Float16Array) ? half(last[token]) : last[token];
            if (value > score) [best, score] = [token, value];
          }
          for (const tensor of Object.values(cache)) if (tensor.location === 'gpu-buffer') tensor.dispose();
          cache = Object.fromEntries(pasts.map((input, index) => [input, outputs[presents[index]]]));
          seen += ids.length;
          ids = [best];
          written.push(best);
          onToken();
        }
        return tokenizer.decode(written, { skip_special_tokens: true });
      },
      close: () => session.release(),
    };
  });
}

// 4. WebLLM. 모델마다 미리 컴파일해 둔 코드(.wasm)와 WebGPU로 돈다.
const WEBLLM = group === 'small'
  ? [['SmolLM2-135M-Instruct-q0f16', 'q0f16']]
  : [['Llama-3.2-1B-Instruct-q0f16', 'q0f16'], ['Llama-3.2-1B-Instruct-q4f16_1', 'q4f16_1']];
for (const [stem, precision] of WEBLLM) {
  await measure(`webllm webgpu ${precision}`, 600, async () => {
    const W = await import(`${MODULES}/@mlc-ai/web-llm/lib/index.js`);
    const id = `${stem}-MLC`;
    const appConfig = {
      useIndexedDBCache: false,
      model_list: [{
        model: `${location.origin}/models/ch50/mlc/${id}`,
        model_id: id,
        model_lib: `${location.origin}/models/ch50/mlc/${stem}_cs1k-webgpu.wasm`,
        overrides: { context_window_size: 4096 },
      }],
    };
    const engine = await W.CreateMLCEngine(id, { appConfig });
    return {
      async ask(messages, most, onToken) {
        let text = '';
        const chunks = await engine.chat.completions.create({ messages, stream: true, max_tokens: most, temperature: 0 });
        for await (const chunk of chunks) {
          const piece = chunk.choices[0]?.delta?.content ?? '';
          if (piece) {
            text += piece;
            onToken();
          }
        }
        return text;
      },
      close: () => engine.unload(),
    };
  });
}

say('done');
sessionStorage.removeItem(KEY);
await sending;
</script>
</body>
</html>
