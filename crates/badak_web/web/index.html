<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브라우저 안의 badak</title>
<style>
  :root { color-scheme: light dark; --table-border-color: #9995; }
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 46em; margin: 2em auto; padding: 0 1em; }
  h1 { font-size: 1.5em; } h2 { font-size: 1.15em; margin-top: 2em; }
  table { border-collapse: collapse; } td, th { border: 1px solid var(--table-border-color); padding: 3px 10px; text-align: left; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; }
  #answer { white-space: pre-wrap; border: 1px solid var(--table-border-color); border-radius: 6px; padding: 10px; min-height: 4em; }
  progress { width: 100%; } .small { font-size: 0.85em; opacity: 0.8; }
  button { font: inherit; }
</style>
</head>
<body>
<h1>브라우저 안의 badak</h1>
<p>『밑바닥부터 만드는 추론 엔진』 <a href="../../part6/ch48_browser.html">48장</a>의 데모입니다.
이 페이지의 계산은 모두 이 브라우저 안에서 일어납니다. 그린 그림도 쓴 글도 어디로도 보내지 않습니다.</p>

<h2>이 브라우저</h2>
<table id="features"></table>
<p class="small" id="isolation"></p>

<h2>숫자 알아맞히기</h2>
<div id="badak-mnist" data-manual="1"></div>

<h2>언어 모델과 이야기하기</h2>
<p>SmolLM2-135M-Instruct를 Hugging Face에서 받습니다(269MB). 한 번 받으면 이 브라우저에 넣어 두고 다음에는 거기에서 꺼냅니다.
영어로 물어야 합니다. 작은 모델이라 틀린 답도 자신 있게 합니다.</p>
<p><button id="download" type="button">모델 받기 (269MB)</button> <button id="forget" type="button">넣어 둔 모델 지우기</button></p>
<progress id="progress" value="0" max="1" hidden></progress>
<p class="small" id="model">아직 받지 않았습니다.</p>
<textarea id="question" rows="2">What is the capital of France?</textarea>
<p><button id="ask" type="button" disabled>묻기</button></p>
<div id="answer"></div>
<p class="small" id="speed"></p>

<script type="module">
import { detect, pick } from './features.js';
import { sources, start, SYSTEM } from './setup.js';
import { mount } from './mnist_demo.js';

const params = new URLSearchParams(location.search);
const local = params.get('models') === 'local';
const plain = params.has('plain');
const $ = (id) => document.getElementById(id);

// ANCHOR: isolate
// 스레드를 쓰려면 페이지가 "교차 출처 격리"되어 있어야 한다. 서버가 헤더를
// 붙여 주지 않았다면 서비스 워커를 등록하고 한 번 다시 읽는다. 다시 읽은
// 페이지는 서비스 워커를 거쳐 오고, 워커가 헤더를 붙인다.
async function isolate() {
  if (crossOriginIsolated || plain || !('serviceWorker' in navigator)) return;
  const registration = await navigator.serviceWorker.register('./coi.js');
  // 한 번 다시 읽었는데도 격리되지 않았다면 그만둔다. 끝없이 다시 읽지 않게.
  if (sessionStorage.getItem('badak-reloaded')) return;
  sessionStorage.setItem('badak-reloaded', '1');
  sessionStorage.removeItem('badak-plain');
  await navigator.serviceWorker.ready;
  if (registration.active && !navigator.serviceWorker.controller) {
    await new Promise((resolve) => navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true }));
  }
  location.reload();
  await new Promise(() => {}); // 다시 읽힐 때까지 아무것도 하지 않는다.
}
// ANCHOR_END: isolate
// 서비스 워커를 못 쓰는 곳도 있다(사생활 보호 창 따위). 그러면 스레드 없이 간다.
await isolate().catch((error) => console.warn('서비스 워커를 등록하지 못했습니다:', error));
// 서비스 워커 없이 열어 달라고 했다. 등록을 지운다. 지워도 지금 이 페이지는
// 여전히 그 워커를 거쳐 온 것이므로, 한 번 다시 읽어 워커 없는 페이지가 된다.
if (plain && navigator.serviceWorker) {
  for (const registration of await navigator.serviceWorker.getRegistrations()) await registration.unregister();
  if (navigator.serviceWorker.controller && !sessionStorage.getItem('badak-plain')) {
    sessionStorage.setItem('badak-plain', '1');
    sessionStorage.removeItem('badak-reloaded');
    location.reload();
    await new Promise(() => {});
  }
}

const features = detect();
const mark = (yes) => (yes ? '됨' : '안 됨');
$('features').innerHTML = `
  <tr><th>128비트 벡터 명령 (simd128)</th><td>${mark(features.simd)}</td></tr>
  <tr><th>relaxed-simd</th><td>${mark(features.relaxed)}</td></tr>
  <tr><th>교차 출처 격리 (스레드)</th><td>${mark(features.threads)}</td></tr>
  <tr><th>브라우저가 알려 준 코어의 수</th><td>${features.cores}</td></tr>
  <tr><th>고른 빌드</th><td>${pick(features)}</td></tr>`;
$('isolation').innerHTML = plain
  ? '서비스 워커 없이 열었습니다. <a href="./">서비스 워커를 써서 다시 열기</a>'
  : '<a href="?plain">서비스 워커 없이 다시 열기</a> (스레드가 꺼집니다)';

const engine = await start({ features });
await mount($('badak-mnist'), { local, engine });

const megabytes = (bytes) => `${(bytes / 1e6).toFixed(0)}MB`;
let opened = false;
$('download').addEventListener('click', async () => {
  $('download').disabled = true;
  $('progress').hidden = false;
  try {
    const began = performance.now();
    let cached = true;
    for (const file of sources(local).llm) {
      const result = await engine.badak.call('file', file, ({ received, total }) => {
        $('progress').value = total ? received / total : 0;
        $('model').textContent = `받는 중: ${megabytes(received)} / ${megabytes(total)}`;
      });
      cached &&= result.cached;
    }
    const fetched = performance.now() - began;
    $('model').textContent = '모델을 여는 중…';
    const { ms, memory } = await engine.badak.call('open');
    for (const { path } of sources(local).llm) await engine.badak.call('forget', { path });
    opened = true;
    $('model').textContent = `${cached ? '넣어 둔 것을 꺼냈습니다' : '받았습니다'} (${(fetched / 1000).toFixed(1)}초). `
      + `여는 데 ${(ms / 1000).toFixed(2)}초, 엔진의 메모리 ${megabytes(memory)}.`;
    $('ask').disabled = false;
  } catch (error) {
    $('model').textContent = `실패했습니다: ${error.message}`;
    $('download').disabled = false;
  }
  $('progress').hidden = true;
});
$('forget').addEventListener('click', async () => {
  await caches.delete('badak-models-v1');
  $('model').textContent = opened ? '지웠습니다. 이미 연 모델은 이 탭을 닫을 때까지 쓸 수 있습니다.' : '지웠습니다.';
});
$('ask').addEventListener('click', async () => {
  $('ask').disabled = true;
  $('answer').textContent = '';
  $('speed').textContent = '';
  try {
    const result = await engine.badak.call('chat', { system: SYSTEM, question: $('question').value, maxTokens: 192 },
      ({ text }) => { $('answer').textContent += text; });
    const rate = result.pieces > 1 ? ((result.pieces - 1) / (result.total - result.first)) * 1000 : 0;
    $('speed').textContent = `첫 글자까지 ${result.first.toFixed(0)}ms, 그 뒤로 초당 ${rate.toFixed(0)}조각. `
      + `${engine.build}, 스레드 ${engine.threads}개.`;
  } catch (error) {
    $('speed').textContent = `실패했습니다: ${error.message}`;
  }
  $('ask').disabled = false;
});
// 측정 스크립트가 여는 경우: 본 것을 서버에 알린다 (scripts/bench_ch48.sh).
if (params.has('report')) {
  let downloaded = '';
  if (params.has('download')) {
    $('download').click();
    while ($('ask').disabled && !$('model').textContent.startsWith('실패')) await new Promise((resolve) => setTimeout(resolve, 200));
    downloaded = ` download ${$('model').textContent}`;
    if (!$('ask').disabled) {
      $('ask').click();
      while (!$('speed').textContent) await new Promise((resolve) => setTimeout(resolve, 200));
      downloaded += ` answer ${$('answer').textContent} ${$('speed').textContent}`;
    }
  }
  // 시계의 눈금: 50ms 동안 쉬지 않고 읽어, 값이 바뀔 때의 가장 작은 차이.
  let [step, last] = [Infinity, performance.now()];
  for (const end = last + 50; last < end; ) {
    const now = performance.now();
    if (now > last) [step, last] = [Math.min(step, now - last), now];
  }
  fetch('/report?name=' + params.get('report'), { method: 'POST',
    body: `isolated ${crossOriginIsolated} timer-us ${(step * 1000).toFixed(1)} build ${engine.build} threads ${engine.threads}${downloaded} agent ${navigator.userAgent}\n` });
}
</script>
</body>
</html>
