name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "crates/**"
      - "scripts/build_web.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.4.48"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/configure-pages@v6
      - name: Build the engine for the browser (chapter 48)
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-wasip1 wasm32-wasip1-threads
          sh scripts/build_web.sh book/src/demos/ch48
      - name: Build book
        run: mdbook build book
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
