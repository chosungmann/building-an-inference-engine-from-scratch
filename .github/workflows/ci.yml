name: CI

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "scripts/*.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check that the engine builds for phones (chapter 44)
        run: |
          rustup target add aarch64-linux-android aarch64-apple-ios
          cargo check -p badak_ffi --target aarch64-linux-android
          cargo check -p badak_ffi --target aarch64-apple-ios
      - name: Cache downloaded models and data
        uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('scripts/download_*.sh') }}
      - name: Download models and data used by the tests
        run: |
          sh scripts/download_mnist.sh
          sh scripts/download_ch07.sh
          sh scripts/download_ch08.sh
          sh scripts/download_smollm2.sh
          sh scripts/download_ch26.sh
          sh scripts/download_ch27.sh
          sh scripts/download_ch29.sh
          sh scripts/download_ch30.sh
          sh scripts/download_ch32.sh
          sh scripts/download_ch33.sh
          sh scripts/download_ch34.sh
          sh scripts/download_ch35.sh text
          sh scripts/download_ch36.sh
          sh scripts/download_ch37.sh
          sh scripts/download_ch38.sh
      - name: Test
        run: cargo test --workspace
      - name: Show the selected SIMD backend
        run: cargo run --release -p badak_bench --example ch17_backend
      - name: Verify the chapter 7 model against PyTorch
        run: cargo run --release -p badak_models --example ch07_verify
      - name: Verify the chapter 26 graphs against LiteRT
        run: cargo run --release -p badak_graph --example ch26_verify
      - name: Verify the chapter 27 models against LiteRT and PyTorch
        run: cargo run --release -p badak_graph --example ch27_verify
      - name: Verify the chapter 29 integer model against LiteRT
        run: cargo run --release -p badak_graph --example ch29_verify
      - name: Verify the chapter 30 optimized graphs against ONNX Runtime
        run: cargo run --release -p badak_graph --example ch30_verify
      - name: Verify the chapter 32 ViT against PyTorch
        run: cargo run --release -p badak_models --example ch32_vit_verify
      - name: Verify the chapter 32 detector against ONNX Runtime
        run: cargo run --release -p badak_image --example ch32_detect
      - name: Verify the chapter 33 speech recognizer against transformers
        run: cargo run --release -p badak_models --example ch33_verify
      - name: Verify the chapter 34 embedding model against transformers
        run: cargo run --release -p badak_models --example ch34_verify
      - name: Verify the chapter 36 vision-language model against transformers
        run: cargo run --release -p badak_models --example ch36_verify
      - name: Verify the chapter 37 speech model's tokens against transformers
        run: cargo run --release -p badak_models --example ch37_verify
      - name: Verify the chapter 39 server against the engine called directly
        run: cargo run --release -p badak_server --example ch39_verify
      - name: Verify that batched requests get the answers they get alone (chapter 40)
        run: cargo run --release -p badak_server --example ch40_verify
      - name: Verify constrained and speculative decoding (chapter 41)
        run: cargo run --release -p badak_models --example ch41_verify
