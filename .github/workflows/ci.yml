name: CI

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "scripts/*.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cache downloaded models and data
        uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('scripts/download_*.sh') }}
      - name: Download models and data used by the tests
        run: |
          sh scripts/download_mnist.sh
          sh scripts/download_ch07.sh
          sh scripts/download_ch08.sh
          sh scripts/download_smollm2.sh
      - name: Test
        run: cargo test --workspace
      - name: Show the selected SIMD backend
        run: cargo run --release -p badak_bench --example ch17_backend
      - name: Verify the chapter 7 model against PyTorch
        run: cargo run --release -p badak_models --example ch07_verify
