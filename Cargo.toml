[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/chosungmann/building-an-inference-engine-from-scratch"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"

# 테스트가 실제 모델의 순전파를 돌린다. 최적화 없이는 몇 분이 걸린다.
[profile.test]
opt-level = 2
